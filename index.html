      /* ───── Logo ticker gradient masks use white — keep */

      /* ═════════════════════════════════════════════════════════════
         DEMO MODAL — pop-out container for the lifecycle demos
         Each lifecycle pill (Setup Store → Multi-Tenant) opens its
         demo inside this overlay so it sits cleanly above the page,
         centered and fully visible without scrolling. Backdrop click
         or ESC closes; chevron advances to the adjacent module.
         ═════════════════════════════════════════════════════════════ */
      .demo-modal-backdrop {
        position: fixed; inset: 0; z-index: 80;
        background: rgba(10, 28, 96, 0.42);
        /* The backdrop and panel are full-rebuilt on every phase render
           (because the inner demos call scrollPreserveRender). We keep
           their entrance keyframes — innerHTML mount fires them once — but
           we DO NOT animate the demo-stage children, since those rebuild
           on every phase tick and would flicker forever. */
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: flex; align-items: flex-start; justify-content: center;
        padding: 4vh 24px;
        overflow-y: auto;
        opacity: 1;
      }
      /* Only animate in on the FIRST mount of the modal — gated by an
         is-fresh flag that JS sets once and clears on the next render. */
      .demo-modal-backdrop.is-fresh {
        animation: demoBackdropIn 220ms ease forwards;
      }
      @keyframes demoBackdropIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      .demo-modal-panel {
        position: relative;
        width: 100%; max-width: 1180px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(10, 28, 96, 0.28), 0 4px 12px rgba(10, 28, 96, 0.12);
        opacity: 1; transform: none;
      }
      .demo-modal-backdrop.is-fresh .demo-modal-panel {
        animation: demoPanelIn 320ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        opacity: 0; transform: translateY(12px) scale(0.985);
      }
      @keyframes demoPanelIn {
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .demo-modal-header {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 18px 12px;
        border-bottom: 1px solid #e2e8f0;
      }
      .demo-modal-stage-label {
        font-size: 9.5px; font-weight: 700;
        color: #64748B; text-transform: uppercase;
        letter-spacing: 0.14em;
      }
      .demo-modal-title {
        font-size: 17px; font-weight: 700;
        color: #0A1C60; letter-spacing: -0.01em;
        display: inline-flex; align-items: center; gap: 8px;
      }
      .demo-modal-title i { width: 18px; height: 18px; color: #0070F3; }
      .demo-modal-progress {
        display: inline-flex; align-items: center; gap: 4px;
        margin-left: 10px;
      }
      .demo-modal-progress-dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #cbd5e1;
        border: 0; padding: 0; cursor: pointer;
        transition: background 0.18s ease, transform 0.18s ease;
      }
      .demo-modal-progress-dot:hover { background: #94a3b8; transform: scale(1.15); }
      .demo-modal-progress-dot.is-active { background: #0070F3; transform: scale(1.3); }
      .demo-modal-progress-dot.is-active:hover { background: #0070F3; }
      .demo-modal-controls {
        margin-left: auto;
        display: inline-flex; align-items: center; gap: 8px;
      }
      .demo-modal-btn {
        width: 34px; height: 34px; border-radius: 9999px;
        display: inline-flex; align-items: center; justify-content: center;
        border: 1px solid #cbd5e1; background: #ffffff; color: #0A1C60;
        cursor: pointer; transition: all 0.18s ease;
      }
      .demo-modal-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
      .demo-modal-btn:disabled { opacity: 0.35; cursor: not-allowed; }
      .demo-modal-btn-next {
        background: #0070F3; color: #ffffff; border-color: #0070F3;
        gap: 6px;
        font-size: 12px; font-weight: 700;
      }
      .demo-modal-btn-next:hover { background: #005AD0; border-color: #005AD0; }
      .demo-modal-btn-next i { width: 14px; height: 14px; }
      .demo-modal-btn-close { color: #64748b; }
      .demo-modal-btn-close i { width: 16px; height: 16px; }
      .demo-modal-body {
        padding: 16px 18px 18px;
        max-height: calc(92vh - 70px);
        overflow: hidden;
      }
      .demo-modal-panel { max-height: 92vh; display: flex; flex-direction: column; }
      .demo-modal-body > #demo-stage { height: 100%; }
      /* Scale the demo content to fit the modal body without scroll. The
         outer body uses overflow:hidden; the inner stage shrinks to fit
         via CSS transform if needed. Each demo's renderer outputs a
         fixed-size canvas that we constrain to width:100% and clamp
         max-height to fit. */
      .demo-modal-body .section-card { max-width: 100%; }
      /* (No per-child entrance animation — the demos run their own phase
         animations internally, and re-rendering would re-trigger this
         every phase tick, causing the flicker the user reported.) */
      @media (max-width: 760px) {
        .demo-modal-backdrop { padding: 2vh 8px; }
        .demo-modal-header { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
        .demo-modal-title { font-size: 15px; }
        .demo-modal-controls { width: 100%; justify-content: flex-end; }
      }

      /* ═════════════════════════════════════════════════════════════
         SETUP STORE VIEW
         ═════════════════════════════════════════════════════════════ */
      .ss-zone { border-radius: 10px; padding: 12px; transition: opacity 0.5s ease, transform 0.5s ease; }
      .ss-zone.ss-hidden { opacity: 0; transform: translateY(10px); }
      .ss-zone.ss-visible { opacity: 1; transform: translateY(0); }

      .ss-vendor-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
      .ss-vendor-tile { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px;
        border-radius: 6px; background: white; border: 1px solid var(--r-divider);
        opacity: 0; transform: scale(0.8); transition: all 0.3s ease; }
      .ss-vendor-tile.ss-show { opacity: 1; transform: scale(1); }
      .ss-vendor-tile .ss-v-icon { width: 26px; height: 26px; border-radius: 6px;
        display: grid; place-items: center; font-size: 9px; font-weight: 800; color: white; }
      .ss-vendor-tile .ss-v-name { font-size: 8px; color: var(--r-ink-2); font-weight: 600; }

      .ss-counter { font-family: ui-monospace, monospace; font-size: 22px; font-weight: 800;
        color: var(--r-blue); letter-spacing: -0.02em; }
      .ss-counter-custom {
        font-family: 'Fraktion Mono','Inter',ui-monospace,monospace;
        font-size: 16px;
        font-weight: 800;
        color: var(--r-blue);
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
      }

      /* Mode toggle */
      .ss-mode-toggle {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: var(--r-quote-bg);
        border: 1px solid var(--r-divider);
      }
      .ss-mode-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        font-size: 11px;
        font-weight: 600;
        color: var(--r-ink-2);
        background: transparent;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        transition: background 150ms, color 150ms, box-shadow 150ms;
        white-space: nowrap;
      }
      .ss-mode-pill:hover { color: var(--r-blue); }
      .ss-mode-pill.is-active {
        background: #fff;
        color: var(--r-blue);
        box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 0 0 1px var(--r-blue);
      }
      .ss-mode-pill .ss-mode-num {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .ss-mode-pill .ss-mode-label { font-weight: 600; }
      .ss-mode-pill.is-active .ss-mode-label { font-weight: 700; }

      /* Custom packaging rail (Phase 1 in custom mode) */
      .ss-custom-rail {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 12px 10px;
        background: linear-gradient(180deg, rgba(0,191,255,0.06), rgba(0,0,204,0.04));
        border: 1px solid rgba(0,0,204,0.12);
        border-radius: 8px;
        margin: 6px 0 4px;
        flex-wrap: wrap;
      }
      .ss-custom-source {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: var(--r-blue);
        color: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,204,0.20);
        opacity: 0; transform: translateY(2px);
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      .ss-custom-source.ss-show { opacity: 1; transform: translateY(0); }
      .ss-custom-source-icon {
        width: 22px; height: 22px;
        display: grid; place-items: center;
        background: rgba(255,255,255,0.16);
        border-radius: 5px;
        color: #fff;
      }
      .ss-custom-source-name { font-size: 11px; font-weight: 800; line-height: 1; }
      .ss-custom-source-version { font-size: 9px; font-weight: 600; opacity: 0.85; margin-top: 2px; }
      .ss-custom-arrow {
        display: inline-flex;
        align-items: center;
        color: #00BFFF;
      }
      .ss-custom-stage {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        background: #fff;
        color: var(--r-ink);
        font-size: 11px;
        font-weight: 700;
        border: 1px solid rgba(0,0,204,0.18);
        border-radius: 999px;
        opacity: 0; transform: translateY(2px);
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      .ss-custom-stage.ss-show { opacity: 1; transform: translateY(0); }
      .ss-custom-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #00BFFF;
        box-shadow: 0 0 0 2px rgba(0,191,255,0.18);
      }
      .ss-custom-target {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        background: #fff;
        color: var(--r-blue);
        font-size: 11px;
        font-weight: 800;
        border: 1px dashed var(--r-blue);
        border-radius: 8px;
        opacity: 0; transform: translateY(2px);
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      .ss-custom-target.ss-show { opacity: 1; transform: translateY(0); }

      /* Custom package icon (Phase 2 in custom mode) */
      .ss-package-icon-custom {
        background: var(--r-blue) !important;
        color: #fff !important;
        position: relative;
      }
      .ss-package-icon-custom::after {
        content: '';
        position: absolute;
        right: -2px; top: -2px;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #00BFFF;
        box-shadow: 0 0 0 2px #fff;
      }
      .ss-vendor-pulse-custom {
        background: var(--r-blue) !important;
        color: #fff !important;
        display: grid;
        place-items: center;
      }

      /* Smooth height-reveal wrapper — @keyframes fires on element insert (unlike transition) */
      .ss-grow { display: grid; grid-template-rows: 0fr; overflow: hidden; }
      .ss-grow > .ss-grow-inner { min-height: 0; }
      .ss-grow.ss-grow-done { grid-template-rows: 1fr; overflow: visible; }
      .ss-grow.ss-grow-active { animation: ssGrowIn 0.55s cubic-bezier(0.4,0,0.2,1) forwards; }
      @keyframes ssGrowIn {
        from { grid-template-rows: 0fr; opacity: 0; }
        to   { grid-template-rows: 1fr; opacity: 1; }
      }

      .ss-package-card { background: white; border: 2px solid var(--r-blue); border-radius: 8px;
        padding: 14px; box-shadow: var(--shadow-elevated); }
      .ss-package-card.ss-pop { /* entry handled by ss-grow wrapper */ }

      .ss-package-header { display: flex; align-items: center; gap: 10px; padding-bottom: 10px;
        border-bottom: 1px solid var(--r-divider); margin-bottom: 10px; }
      .ss-package-icon { width: 32px; height: 32px; border-radius: 7px; display: grid; place-items: center;
        font-size: 13px; font-weight: 800; color: white; }
      .ss-package-name { font-size: 13px; font-weight: 700; color: var(--r-ink); }
      .ss-package-version { font-size: 10px; color: var(--r-ink-2); font-family: ui-monospace, monospace; }

      .ss-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .ss-field { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 4px;
        background: var(--r-quote-bg); font-size: 10px; color: var(--r-ink);
        opacity: 0; transform: translateX(-6px); transition: all 0.3s ease; }
      .ss-field.ss-fill { opacity: 1; transform: translateX(0); }
      .ss-field i[data-lucide] { width: 12px; height: 12px; color: var(--r-blue-bright); flex-shrink: 0; }

      .ss-security-row { display: flex; gap: 8px; margin-top: 10px;
        opacity: 0; transform: translateY(6px); transition: all 0.4s ease; }
      .ss-security-row.ss-show { opacity: 1; transform: translateY(0); }
      .ss-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
        border-radius: 4px; font-size: 10px; font-weight: 700; }
      .ss-badge-clean { background: #ECFDF5; color: var(--r-green); border: 1px solid #A7F3D0; }
      .ss-badge-cve { background: #FFF7ED; color: var(--r-amber); border: 1px solid #FED7AA; }
      .ss-badge-supersede { background: var(--r-quote-bg); color: var(--r-blue); border: 1px solid var(--r-divider);
        font-family: ui-monospace, monospace; }

      .ss-update-flow { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px;
        border-radius: 6px; background: var(--r-quote-bg); border: 1px dashed var(--r-blue-bright);
        opacity: 0; transition: opacity 0.4s ease; }
      .ss-update-flow.ss-show { opacity: 1; }
      .ss-vendor-pulse { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center;
        font-size: 10px; font-weight: 800; color: white; background: var(--r-blue); flex-shrink: 0; }
      .ss-vendor-pulse.ss-pulsing { animation: ssPulse 1.5s ease-in-out infinite; }
      @keyframes ssPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(42,127,255,0); }
                           50% { box-shadow: 0 0 0 6px rgba(42,127,255,0.25); } }
      @keyframes ssPulseCta {
        0%, 100% { box-shadow: 0 2px 8px rgba(0, 0, 204, 0.25); }
        50% { box-shadow: 0 2px 16px rgba(0, 191, 255, 0.55); }
      }
      .ss-pulse-cta { animation: ssPulseCta 2s ease-in-out infinite; }

      .ss-dtap-bar { display: flex; align-items: center; gap: 0; margin-top: 10px; }
      .ss-dtap-stage { flex: 1; text-align: center; padding: 5px 4px; font-size: 9px; font-weight: 700;
        color: var(--r-ink-2); border-bottom: 3px solid var(--r-divider); transition: all 0.4s ease; }
      .ss-dtap-stage.ss-done { border-color: var(--r-green); color: var(--r-green); }
      .ss-dtap-stage.ss-current { border-color: var(--r-blue); color: var(--r-blue); }
      .ss-dtap-arrow { font-size: 10px; color: var(--r-divider); padding: 0 2px; }

      .ss-fanout { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 14px; }
      .ss-fanout-source { padding: 6px 14px; border-radius: 6px; background: var(--r-blue); color: white;
        font-size: 11px; font-weight: 700; }
      .ss-fanout-lines { display: flex; justify-content: center; gap: 24px; }
      .ss-fanout-line { width: 2px; height: 0; background: linear-gradient(180deg, var(--r-blue), var(--r-blue-bright));
        border-radius: 2px; transition: height 0.6s ease; }
      .ss-fanout-line.ss-drawn { height: 24px; }
      .ss-fanout-targets { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
      .ss-target { padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 600;
        background: white; border: 1px solid var(--r-divider); color: var(--r-ink-2);
        opacity: 0; transform: translateY(4px); transition: all 0.4s ease; }
      .ss-target.ss-show { opacity: 1; transform: translateY(0); }
      .ss-target.ss-primary { border-color: var(--r-blue); color: var(--r-blue); font-weight: 700; }

      .ss-callouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
      .ss-callout { padding: 12px; border-radius: 6px; background: white; border: 1px solid var(--r-divider); }
      .ss-callout i[data-lucide] { width: 18px; height: 18px; color: var(--r-blue-bright); margin-bottom: 6px; }
      .ss-callout-title { font-size: 12px; font-weight: 700; color: var(--r-ink); margin-bottom: 3px; }
      .ss-callout-body { font-size: 10px; color: var(--r-ink-2); line-height: 1.4; }

      .ss-final-line { text-align: center; margin-top: 14px; padding: 10px; font-size: 13px; font-weight: 700;
        color: var(--r-blue); background: var(--r-quote-bg); border-radius: 6px; }

      .ss-categories-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px;
        margin-top: 8px;
      }
      .ss-cat-pill {
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: white;
        border: 1px solid var(--r-divider);
        color: var(--r-ink-2);
      }

      .ss-arrow-active {
        color: var(--r-blue) !important;
        font-weight: 700;
        animation: ssArrowPulse 1.2s ease-in-out infinite;
      }
      .ss-arrow-pending {
        color: var(--r-divider) !important;
      }
      @keyframes ssArrowPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      .ss-connectors-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--r-ink-2);
        margin-top: 4px;
        margin-bottom: 4px;
      }

      /* ═════════════════════════════════════════════════════════════
         SETUP STORE — 3-ACT ANIMATION STAGE
         ═════════════════════════════════════════════════════════════ */
      .ss-act-stage {
        position: relative;
        min-height: 360px;
      }

      /* Caption row (above visual) — flicker during ticker, settle on resolve */
      .ss-caption-stream {
        height: 28px;
        line-height: 28px;
        text-align: center;
        font-family: ui-monospace, 'Fraktion Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        color: var(--r-ink-2);
        letter-spacing: -0.005em;
        margin-bottom: 8px;
        transition: color 200ms ease, background 200ms ease;
        border-radius: 6px;
      }
      .ss-caption-stream.ss-caption-empty { color: transparent; }
      .ss-caption-stream.ss-caption-flicker {
        animation: ssCaptionFlick 60ms steps(1) infinite;
        color: var(--r-blue);
      }
      .ss-caption-stream.ss-caption-final {
        color: var(--r-blue);
        background: var(--r-quote-bg);
        font-size: 13px;
        font-weight: 800;
        animation: ssCaptionResolve 360ms cubic-bezier(0.2,0.8,0.2,1) both;
      }
      @keyframes ssCaptionFlick {
        0%   { opacity: 1; }
        50%  { opacity: 0.55; }
      }
      @keyframes ssCaptionResolve {
        0%   { transform: scale(0.96); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      .ss-act-panel {
        position: relative;
        transition: opacity 320ms ease;
      }
      .ss-act-panel.ss-act-show { opacity: 1; }
      .ss-act-panel.ss-act-hide { opacity: 0; }

      /* ── Act 1: catalog scale ───────────────────────────────────
         Top bar: counter "8,047" + small "+ yours" foreshadow + 5 category counts.
         Below: a dense scrolling list of real apps so you can SEE the volume,
         ending with a single "YourApp · custom" row that lives in the same list. */
      .ss-act1-stage {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: white;
        border: 1px solid var(--r-divider);
        border-radius: 10px;
        padding: 14px;
      }

      .ss-act1-top {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 28px;
        align-items: center;
      }
      .ss-act1-headline {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .ss-act1-eyebrow {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--r-ink-2);
      }
      .ss-act1-count-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .ss-counter-big {
        font-family: ui-monospace, 'Fraktion Mono', monospace;
        font-size: 56px;
        font-weight: 800;
        color: var(--r-ink);
        letter-spacing: -0.04em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .ss-act1-plus {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px dashed var(--r-divider);
        border-radius: 8px;
        background: var(--r-quote-bg);
      }
      .ss-act1-plus-sign {
        font-size: 18px;
        font-weight: 700;
        color: var(--r-blue);
        line-height: 1;
        font-family: ui-monospace, monospace;
      }
      .ss-act1-plus-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--r-ink);
      }
      .ss-act1-cats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }
      .ss-act1-cat {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 6px 8px;
        border-left: 2px solid var(--r-divider);
      }
      .ss-act1-cat-num {
        font-family: ui-monospace, monospace;
        font-size: 14px;
        font-weight: 700;
        color: var(--r-ink);
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .ss-act1-cat-name {
        font-size: 10px;
        color: var(--r-ink-2);
        font-weight: 500;
      }

      /* Dense scrolling catalog list — the real evidence of volume */
      .ss-catalog {
        position: relative;
        border: 1px solid var(--r-divider);
        border-radius: 8px;
        background: white;
        overflow: hidden;
      }
      .ss-catalog-head {
        display: grid;
        grid-template-columns: 1fr 130px 110px;
        gap: 12px;
        padding: 6px 12px;
        background: var(--r-quote-bg);
        border-bottom: 1px solid var(--r-divider);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--r-ink-2);
      }
      .ss-catalog-viewport {
        position: relative;
        height: 180px;
        overflow: hidden;
      }
      .ss-catalog-track {
        display: flex;
        flex-direction: column;
        animation: ssCatalogScroll 28s linear infinite;
      }
      @keyframes ssCatalogScroll {
        from { transform: translateY(0); }
        /* The list is doubled at render time; scroll exactly half so it loops seamlessly */
        to   { transform: translateY(-50%); }
      }
      .ss-catalog-row {
        display: grid;
        grid-template-columns: 1fr 130px 110px;
        gap: 12px;
        align-items: center;
        padding: 7px 12px;
        border-bottom: 1px solid var(--r-divider);
        flex-shrink: 0;
      }
      .ss-catalog-row:last-child { border-bottom: 1px solid var(--r-divider); }
      .ss-catalog-app {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .ss-catalog-icon {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 800;
        color: white;
        flex-shrink: 0;
      }
      .ss-catalog-icon-custom {
        background: white;
        color: var(--r-blue);
        border: 1.5px dashed var(--r-blue);
      }
      .ss-catalog-name {
        font-size: 12px;
        font-weight: 600;
        color: var(--r-ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ss-catalog-dim {
        font-weight: 500;
        color: var(--r-ink-2);
      }
      .ss-catalog-ver {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: var(--r-ink-2);
        font-variant-numeric: tabular-nums;
      }
      .ss-catalog-status {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        font-weight: 600;
        color: #15803d;
      }
      .ss-catalog-status [data-lucide] { color: #16a34a; }
      .ss-catalog-row-custom {
        background: var(--r-quote-bg);
      }
      .ss-catalog-status-custom {
        color: var(--r-blue);
      }
      .ss-catalog-status-custom [data-lucide] { color: var(--r-blue); }

      /* Top + bottom fade masks soften the marquee edges */
      .ss-catalog-fade {
        position: absolute;
        left: 0; right: 0;
        height: 24px;
        pointer-events: none;
        z-index: 2;
      }
      .ss-catalog-fade-top {
        top: 26px; /* sits below the header row */
        background: linear-gradient(180deg, white 0%, rgba(255,255,255,0) 100%);
      }
      .ss-catalog-fade-bottom {
        bottom: 0;
        background: linear-gradient(0deg, white 0%, rgba(255,255,255,0) 100%);
      }

      /* ── FINAL beat: synthesis frame — two parallel columns + handoff ──
         Static layout. No motion. The visual claim: Setup Store and Custom
         Packaging are the same engine pointed at two different inputs, and
         both flow into the same Admin Console. */
      .ss-synth {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .ss-synth-header {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .ss-synth-headline {
        font-size: 18px;
        font-weight: 700;
        color: var(--r-ink);
        letter-spacing: -0.01em;
      }
      .ss-synth-sub {
        font-size: 12px;
        color: var(--r-ink-2);
        font-weight: 500;
      }

      .ss-synth-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        align-items: stretch;
      }
      .ss-synth-col {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        background: white;
        border-radius: 10px;
        border-width: 1px;
        border-style: solid;
        position: relative;
      }
      .ss-synth-col-store  { border-color: rgba(74, 100, 255, 0.35); box-shadow: 0 0 0 3px rgba(74, 100, 255, 0.05); }
      .ss-synth-col-custom { border-color: rgba(0, 191, 255, 0.4);  box-shadow: 0 0 0 3px rgba(0, 191, 255, 0.06); }

      .ss-synth-col-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--r-divider);
      }
      .ss-synth-col-title {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--r-ink);
        font-weight: 700;
        font-size: 14px;
      }
      .ss-synth-col-store .ss-synth-col-title [data-lucide]  { color: var(--r-blue); }
      .ss-synth-col-custom .ss-synth-col-title [data-lucide] { color: #00BFFF; }

      .ss-synth-pill {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 999px;
      }
      .ss-synth-pill-store  { background: var(--r-quote-bg); color: var(--r-blue); }
      .ss-synth-pill-custom { background: rgba(0, 191, 255, 0.12); color: #0288A8; }

      .ss-synth-payload {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 132px;
      }
      .ss-synth-num {
        font-family: ui-monospace, 'Fraktion Mono', monospace;
        font-size: 36px;
        font-weight: 800;
        color: var(--r-ink);
        letter-spacing: -0.04em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .ss-synth-num-label {
        font-size: 11px;
        color: var(--r-ink-2);
        font-weight: 500;
      }
      .ss-synth-vendors {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 4px;
      }
      .ss-synth-vendor {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px 3px 3px;
        background: white;
        border: 1px solid var(--r-divider);
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        color: var(--r-ink);
      }
      .ss-synth-vendor .ss-v-icon {
        width: 18px; height: 18px;
        border-radius: 4px;
        display: grid; place-items: center;
        font-size: 8px; font-weight: 800;
        color: white;
      }
      .ss-synth-vendor .ss-v-name { font-size: 10px; }
      .ss-synth-vendor-more {
        display: inline-flex;
        align-items: center;
        padding: 4px 8px;
        font-size: 10px;
        font-weight: 600;
        color: var(--r-ink-2);
        background: var(--r-quote-bg);
        border-radius: 999px;
      }

      .ss-synth-custom-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        background: rgba(0, 191, 255, 0.06);
        border: 1px dashed rgba(0, 191, 255, 0.4);
        border-radius: 8px;
      }
      .ss-synth-custom-icon {
        width: 36px; height: 36px;
        border-radius: 7px;
        background: white;
        border: 1.5px dashed #00BFFF;
        color: #00BFFF;
        display: grid; place-items: center;
      }
      .ss-synth-custom-meta { display: flex; flex-direction: column; gap: 1px; }
      .ss-synth-custom-name {
        font-size: 13px;
        font-weight: 700;
        color: var(--r-ink);
      }
      .ss-synth-dim { font-weight: 500; color: var(--r-ink-2); }
      .ss-synth-custom-sub {
        font-size: 10px;
        color: var(--r-ink-2);
        font-family: ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .ss-synth-custom-note {
        font-size: 11px;
        color: var(--r-ink-2);
        line-height: 1.4;
        margin-top: 2px;
      }

      .ss-synth-spine {
        list-style: none;
        margin: 0;
        padding: 8px 0 0 0;
        border-top: 1px dashed var(--r-divider);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
      }
      .ss-synth-step {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--r-ink);
        font-weight: 500;
        line-height: 1.3;
      }
      .ss-synth-check {
        width: 12px; height: 12px;
        flex-shrink: 0;
      }
      .ss-synth-step-store .ss-synth-check,
      .ss-synth-step-custom .ss-synth-check    { color: #16a34a; }
      .ss-synth-step-inherited .ss-synth-check { color: #00BFFF; }
      .ss-synth-step-inherited                  { color: var(--r-ink); }
      .ss-synth-badge-inherit {
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #0288A8;
        margin-left: auto;
      }

      .ss-synth-foot {
        font-size: 11px;
        color: var(--r-ink-2);
        font-style: italic;
        padding-top: 8px;
        border-top: 1px dashed var(--r-divider);
        margin-top: auto;
      }

      .ss-synth-handoff {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 4px 0 0 0;
      }
      .ss-synth-handoff-line {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent 0%, var(--r-divider) 50%, transparent 100%);
      }
      .ss-synth-handoff-label {
        font-size: 12px;
        color: var(--r-ink);
        font-weight: 500;
        white-space: nowrap;
      }
      .ss-synth-handoff-label strong {
        font-weight: 700;
        color: var(--r-blue);
      }
      .ss-synth-handoff-label [data-lucide] {
        color: var(--r-blue);
      }

      /* Act progress bar (replaces "(1 of 4)" pill in header) */
      .ss-act-progress {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        background: white;
        border: 1px solid var(--r-divider);
        border-radius: 999px;
      }
      .ss-act-step {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 9px;
        font-weight: 700;
        color: var(--r-ink-2);
        letter-spacing: 0.04em;
        transition: all 180ms ease;
      }
      .ss-act-step-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--r-divider);
        transition: all 180ms ease;
      }
      .ss-act-step.is-done {
        color: var(--r-ink-2);
      }
      .ss-act-step.is-done .ss-act-step-dot {
        background: #22c55e;
      }
      .ss-act-step.is-active {
        background: var(--r-quote-bg);
        color: var(--r-blue);
      }
      .ss-act-step.is-active .ss-act-step-dot {
        background: var(--r-blue);
        box-shadow: 0 0 0 3px rgba(74, 100, 255, 0.18);
      }

      /* ── Acts 2 + 3: cards stage ─────────────────────────────── */
      .ss-cards-stage {
        position: relative;
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        transition: grid-template-columns 380ms cubic-bezier(0.4,0.0,0.2,1);
      }
      .ss-cards-stage.ss-cards-shifted {
        grid-template-columns: 1fr 1fr;
      }
      .ss-cards-stage .ss-package-card {
        margin: 0;
        transition: transform 380ms cubic-bezier(0.4,0.0,0.2,1),
                    box-shadow 320ms ease;
      }

      /* Adobe card slides slightly left when shifted; YourApp slides in from right */
      .ss-card-adobe { z-index: 2; }
      .ss-card-adobe.ss-card-shifted {
        box-shadow: var(--shadow-elevated), 0 0 0 1px rgba(0,0,204,0.05);
      }
      .ss-card-your {
        opacity: 0;
        transform: translateX(40px);
        pointer-events: none;
        transition: opacity 380ms ease, transform 380ms cubic-bezier(0.2,0.8,0.2,1);
        border-color: var(--r-blue) !important;
      }
      .ss-card-your.ss-card-your-in {
        opacity: 1;
        transform: translateX(0);
        pointer-events: auto;
      }

      /* When stage is NOT shifted, only Adobe occupies the grid; hide YourApp slot */
      .ss-cards-stage:not(.ss-cards-shifted) .ss-card-your {
        display: none;
      }

      /* Field check mark — appears when field is done */
      .ss-field-check {
        width: 12px; height: 12px;
        margin-left: auto;
        color: var(--r-green);
        flex-shrink: 0;
        animation: ssCheckPop 280ms cubic-bezier(0.2,0.8,0.2,1) both;
      }
      @keyframes ssCheckPop {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.2); }
        100% { transform: scale(1); opacity: 1; }
      }
      .ss-field-done { background: rgba(16,129,86,0.05) !important; border-left: 2px solid var(--r-green); padding-left: 6px; }
      .ss-field-inherited { border-left-color: #00BFFF !important; background: rgba(0,191,255,0.06) !important; }
      .ss-field-inherited::before {
        content: '';
        position: absolute;
        left: -2px; top: 0; bottom: 0;
        width: 2px;
        background: linear-gradient(180deg, #00BFFF, var(--r-blue));
      }

      /* SVG inheritance lines layer */
      .ss-inherit-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
        z-index: 3;
      }
      .ss-inherit-line {
        fill: none;
        stroke: #00BFFF;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: var(--len, 200);
        stroke-dashoffset: var(--len, 200);
        filter: drop-shadow(0 0 4px rgba(0,191,255,0.6));
        animation: ssLineDraw 360ms cubic-bezier(0.4,0.0,0.2,1) forwards;
      }
      @keyframes ssLineDraw {
        to { stroke-dashoffset: 0; }
      }

      /* Badge pop animation (used for security badges in both cards) */
      .ss-security-row.ss-show .ss-badge-pop {
        opacity: 0;
        transform: scale(0.85);
        animation: ssBadgePop 320ms cubic-bezier(0.2,0.8,0.2,1) forwards;
        animation-delay: var(--pop-delay, 0ms);
      }
      @keyframes ssBadgePop {
        to { opacity: 1; transform: scale(1); }
      }

      /* Final beat — combined source badges */
      .ss-fanout-source-combined {
        display: inline-flex !important;
        align-items: center;
        gap: 6px;
      }
      .ss-fanout-source-badges {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: 6px;
        padding-left: 8px;
        border-left: 1px solid rgba(255,255,255,0.25);
      }
      .ss-fanout-mini-badge {
        width: 18px; height: 18px;
        border-radius: 4px;
        display: inline-grid;
        place-items: center;
        font-size: 10px;
        font-weight: 800;
      }
      .ss-fanout-mini-adobe { background: #ED2224; color: #fff; }
      .ss-fanout-mini-your { background: #00BFFF; color: #fff; }
      .ss-fanout-mini-your i { width: 10px; height: 10px; }

      /* ═════════════════════════════════════════════════════════════
         MOBILE — comprehensive overhaul for <= 900px
         Goal: every tab usable with a single vertical scroll, no overflow.
         ═════════════════════════════════════════════════════════════ */
      html, body { overflow-x: hidden; }

      @media (max-width: 900px) {
        /* Unlock the scroll-free shell — mobile uses normal document scroll */
        html, body { overflow-x: hidden; overflow-y: auto; height: auto; }
        body > #app { height: auto; display: block; }
        body > #app > main.mx-auto {
          overflow: visible;
          height: auto;
          padding-top: 12px !important;
          padding-bottom: 24px !important;
        }
        body > #app > main.mx-auto > section {
          padding: 0 14px !important;
          max-width: 100% !important;
        }

        /* ── Hero ─────────────────────────────────────── */
        header.relative::before, header.relative::after { display: none; }
        header.relative > div:first-child {
          padding: 20px 14px 14px !important;
        }
        .recast-eyebrow-row { margin-bottom: 10px !important; gap: 10px !important; }
        .recast-eyebrow-mark { width: 30px !important; height: 30px !important; }
        .recast-eyebrow-mark svg { width: 16px !important; height: 16px !important; }
        .recast-eyebrow-label { font-size: 13px !important; }
        header.relative h1 {
          font-size: 26px !important;
          line-height: 1.15 !important;
          max-width: none !important;
        }
        header.relative h1::after { width: 36px !important; height: 2px !important; margin-top: 10px !important; }
        header.relative p {
          font-size: 13px !important;
          line-height: 1.5 !important;
          margin-top: 10px !important;
          max-width: none !important;
        }

        /* ── Tabs — horizontal scroll rail ────────────── */
        header.relative > div:last-child { padding: 0 !important; }
        .recast-tabs {
          padding: 0 14px !important;
          margin-top: 14px !important;
          border-top: 1px solid rgba(255,255,255,0.15) !important;
          -webkit-overflow-scrolling: touch;
        }
        .recast-tab {
          padding: 12px 14px !important;
          font-size: 13px !important;
          gap: 6px !important;
        }
        .recast-tab svg, .recast-tab i { width: 14px !important; height: 14px !important; }

        /* ── Sections / cards ─────────────────────────── */
        #panel-problems.space-y-4 > * + *,
        #panel-solution.space-y-3 > * + *,
        #panel-roi.space-y-4 > * + * { margin-top: 10px !important; }
        .section-card { padding: 14px !important; border-radius: 6px !important; }
        .section-card.p-6, .section-card.p-8 { padding: 14px !important; }
        .section-card h2, .section-card h3 { font-size: 15px !important; margin-bottom: 6px !important; }
        .sub-card, .sub-card.p-6, .sub-card.p-4 { padding: 10px !important; }

        /* ── Universal: collapse desktop grid/flex layouts ── */
        main.mx-auto .grid.grid-cols-2,
        main.mx-auto .grid.grid-cols-3,
        main.mx-auto .grid.grid-cols-4,
        main.mx-auto .md\:grid-cols-2,
        main.mx-auto .md\:grid-cols-3,
        main.mx-auto .md\:grid-cols-4,
        main.mx-auto .lg\:grid-cols-2,
        main.mx-auto .lg\:grid-cols-3,
        main.mx-auto .lg\:grid-cols-4 {
          grid-template-columns: 1fr !important;
          gap: 10px !important;
        }
        main.mx-auto .flex.gap-4,
        main.mx-auto .flex.gap-6,
        main.mx-auto .flex.gap-8 {
          flex-wrap: wrap !important;
          gap: 10px !important;
        }
        /* Any flex row with explicit widths should stack */
        main.mx-auto .flex.flex-row:not(.no-mobile-stack) {
          flex-direction: column !important;
          align-items: stretch !important;
        }

        /* ── Capacity gap chart — scale to fit viewport ── */
        .chart-container { overflow: visible !important; max-height: 260px !important; aspect-ratio: auto !important; }
        #capacity-gap-chart { min-width: 0 !important; width: 100% !important; max-height: 260px !important; height: 260px !important; }
        #capacity-gap-chart svg { width: 100% !important; height: 100% !important; }
        /* Driver pills row */
        .driver-pills, .drivers-row { flex-wrap: wrap !important; gap: 6px !important; }
        .driver-pill, .driver-pills button { font-size: 11px !important; padding: 6px 8px !important; }

        /* ── Device frames (Admin View, Multi-tenant, Onboarding etc) ── */
        .device-frame,
        #deviceFrame, #ap-device-frame, #mt-device-frame, #ob-device-frame, #dr-device-frame {
          max-width: 100% !important;
          width: 100% !important;
          max-height: none !important;
          transform: none !important;
          border-radius: 8px !important;
        }
        .device-frame .device-header { padding: 6px 10px !important; font-size: 11px !important; }
        .device-frame .sidebar,
        .device-frame [class*="sidebar"] {
          display: none !important;
        }
        .device-frame .main-content,
        .device-frame [class*="main-content"] {
          width: 100% !important;
          padding: 12px !important;
        }
        /* Fallback: collapse any inner two-column split inside device frames */
        .device-frame .grid-cols-\[200px_1fr\],
        .device-frame .grid-cols-\[240px_1fr\],
        .device-frame .grid-cols-\[260px_1fr\] {
          grid-template-columns: 1fr !important;
        }

        /* ── Catalog / tile grids ─────────────────────── */
        .catalog-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
        .catalog-grid .tile, .catalog-grid > * { padding: 8px !important; font-size: 12px !important; }
        .ap-cascade-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 4px !important; }

        /* ── Flip cards ───────────────────────────────── */
        .flip-card { height: auto !important; min-height: 80px !important; }
        .flip-card-inner, .flip-card-front, .flip-card-back { position: relative !important; height: auto !important; min-height: 80px !important; }

        /* ── ROI form ─────────────────────────────────── */
        .roi-form-row,
        .roi-grid,
        #panel-roi .grid {
          grid-template-columns: 1fr !important;
          gap: 12px !important;
        }
        #panel-roi input[type="number"],
        #panel-roi input[type="text"],
        #panel-roi input[type="range"] {
          max-width: 100% !important;
          width: 100% !important;
        }
        /* ROI output tiles — 2 per row, not 4 */
        #panel-roi .roi-outputs,
        #panel-roi .grid.grid-cols-4 { grid-template-columns: repeat(2, 1fr) !important; }

        /* ── Tables ───────────────────────────────────── */
        table { font-size: 12px !important; }
        table th, table td { padding: 6px 8px !important; }
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        /* ── Modals ──────────────────────────────────── */
        .modal-overlay { padding: 12px !important; }
        .modal-overlay > div,
        .modal-overlay .modal-card {
          width: 100% !important;
          max-width: 100% !important;
          max-height: 90vh !important;
          padding: 16px !important;
          margin: 0 !important;

      .bi-compare-stat-sub {

        font-weight: 500;
        color: var(--r-ink-2);
        white-space: nowrap;
      }
      .bi-compare-axis {
        display: grid;
        grid-template-columns: 160px 1fr 110px;
        gap: 18px;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--r-divider);
      }
      .bi-compare-axis-track {
        position: relative;
        height: 14px;
      }
      .bi-compare-summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin: 14px -24px -20px;
        padding: 14px 24px;
        background: linear-gradient(90deg, #F0FDF4 0%, #ECFDF5 100%);
        border-top: 1px solid #BBF7D0;
        border-radius: 0 0 8px 8px;
        font-size: 13px;
        color: #065F46;
        flex-wrap: wrap;
        line-height: 1.35;
      }
      .bi-compare-summary-left {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .bi-compare-summary-from {
        font-size: 18px;
        font-weight: 800;
        color: #1F2937;
        letter-spacing: -0.015em;
        font-variant-numeric: tabular-nums;
      }
      .bi-compare-summary-arrow {
        color: var(--r-ink-2);
        font-weight: 700;
        margin: 0 2px;
      }
      .bi-compare-summary-to {
        font-size: 18px;
        font-weight: 800;
        color: var(--r-blue);
        letter-spacing: -0.015em;
        font-variant-numeric: tabular-nums;
      }
      .bi-compare-summary-tag {
        font-size: 12px;
        font-weight: 600;
        color: var(--r-ink-2);
      }
      .bi-compare-summary-right {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-weight: 600;
      }
      .bi-compare-summary-pct {
        font-size: 22px;
        font-weight: 800;
        color: #047857;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .bi-compare-summary-detail b {
        color: #065F46;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      @media (max-height: 900px) {
        #panel-roi .bi-compare-summary { padding: 10px 18px !important; margin: 10px -18px -14px !important; }
        #panel-roi .bi-compare-summary-from,
        #panel-roi .bi-compare-summary-to { font-size: 15px !important; }
        #panel-roi .bi-compare-summary-pct { font-size: 18px !important; }
        #panel-roi .bi-compare-summary { font-size: 12px !important; }
        #panel-roi .bi-compare-stat-pct { font-size: 15px !important; }
        #panel-roi .bi-compare-stat-sub { font-size: 10px !important; }
        #panel-roi .bi-compare-row { grid-template-columns: 130px 1fr 92px !important; gap: 12px !important; padding: 7px 0 !important; }
        #panel-roi .bi-compare-axis { grid-template-columns: 130px 1fr 92px !important; gap: 12px !important; }
        #panel-roi .bi-compare-label-sub { font-size: 10px !important; margin-top: 2px !important; }
      }
      .bi-compare-axis-tick {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        font-size: 10px;
        font-weight: 600;
        color: var(--r-ink-2);
        white-space: nowrap;
      }

      /* KPI summary cards */
      .bi-kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .bi-kpi {
        border-radius: 8px;
        padding: 18px 20px;
        border: 1px solid;
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .bi-kpi-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .bi-kpi-value {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .bi-kpi-unit {
        font-size: 15px;
        font-weight: 600;
        margin-left: 4px;
      }
      .bi-kpi-sub {
        font-size: 12px;
        font-weight: 500;
        line-height: 1.4;
        margin-top: 2px;
      }
      .bi-kpi-old {
        background: #FEE2E2;
        border-color: #FCA5A5;
        color: #7F1D1D;
      }
      .bi-kpi-old .bi-kpi-label { color: var(--r-red); }
      .bi-kpi-old .bi-kpi-sub { color: #991B1B; }
      .bi-kpi-new {
        background: #DDE6FF;
        border-color: #A5B4FC;
        color: #1E1B96;
      }
      .bi-kpi-new .bi-kpi-label { color: var(--r-blue); }
      .bi-kpi-new .bi-kpi-sub { color: #312E81; }
      .bi-kpi-strategy {
        background: #CFF4FA;
        border-color: #7DD3FC;
        color: #075985;
      }
      .bi-kpi-strategy .bi-kpi-label { color: #0369A1; }
      .bi-kpi-strategy .bi-kpi-sub { color: #0C4A6E; }

      /* Action bar */
      .bi-actionbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 4px;
        flex-wrap: wrap;
      }
      .bi-action-primary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--r-blue);
        color: #fff;
        padding: 10px 20px;
        font-size: 13px;
        font-weight: 700;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
        transition: background 150ms;
      }
      .bi-action-primary:hover { background: var(--r-blue-hover); }
      .bi-action-secondary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: transparent;
        color: var(--r-blue);
        padding: 10px 18px;
        font-size: 13px;
        font-weight: 700;
        border: 1.5px solid var(--r-blue);
        border-radius: 4px;
        cursor: pointer;
        transition: all 150ms;
      }
      .bi-action-secondary:hover { background: var(--r-quote-bg); }
      .bi-pdf-input {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #fff;
        border: 2px solid var(--r-blue);
        border-radius: 4px;
        padding: 6px 10px;
      }
      .bi-pdf-input input {
        border: 0;
        outline: none;
        font-size: 13px;
        font-weight: 600;
        color: var(--r-ink);
        width: 200px;
      }
      .bi-pdf-submit {
        width: 28px; height: 28px;
        border-radius: 4px;
        background: var(--r-blue);
        border: 0;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .bi-pdf-cancel { color: #94a3b8; font-size: 14px; cursor: pointer; padding: 0 4px; }

      /* Section eyebrow — separates Ongoing vs One-time stories */
      .bi-section-eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--r-ink-2);
        margin: 0 0 8px 2px;
        padding: 5px 0;
        line-height: 1;
      }
      .bi-section-eyebrow::before {
        content: "";
        width: 18px; height: 2px;
        background: var(--r-blue);
        border-radius: 1px;
        flex-shrink: 0;
      }
      /* Compounding-value card — stacks one-time + recurring across Year 1, 2, 3 */
      .bi-compound {
        background: #fff;
        border: 1px solid var(--r-divider);
        border-radius: 8px;
        padding: 20px 24px;
        box-shadow: var(--shadow-card);
      }
      .bi-compound-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--r-divider);
        flex-wrap: wrap;
      }
      .bi-compound-head-main { min-width: 0; flex: 1 1 320px; }
      .bi-compound-hero {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        margin: 0 0 6px;
      }
      .bi-compound-hero-num {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #047857;
        line-height: 0.95;
      }
      .bi-compound-hero-unit {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #047857;
        line-height: 1.2;
      }
      .bi-compound-hero-suffix {
        font-size: 17px;
        font-weight: 500;
        color: var(--r-ink);
        line-height: 1.2;
      }
      .bi-compound-sub { font-size: 13px; color: var(--r-ink-2); margin-top: 6px; line-height: 1.5; max-width: 560px; }
      .bi-compound-sub b { color: var(--r-ink); font-weight: 700; }
      .bi-compound-legend { display: inline-flex; align-items: center; gap: 14px; flex-shrink: 0; flex-wrap: wrap; }
      .bi-compound-legend-item {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 11px; font-weight: 600; color: var(--r-ink-2);
      }
      .bi-compound-legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
      .bi-compound-legend-swatch.is-onetime { background: #D97706; }
      .bi-compound-legend-swatch.is-recurring { background: var(--r-blue); }
      .bi-compound-inputs {
        background: var(--r-quote-bg);
        border: 1px solid var(--r-divider);
        border-radius: 6px;
        padding: 10px 14px;
        margin-bottom: 16px;
      }
      .bi-compound-rows { display: flex; flex-direction: column; gap: 12px; }
      .bi-compound-row {
        display: grid;
        grid-template-columns: 72px 1fr 130px;
        gap: 16px;
        align-items: center;
      }
      .bi-compound-row-label {
        font-size: 14px; font-weight: 800; color: var(--r-ink);
        letter-spacing: -0.01em;
      }
      .bi-compound-bar {
        display: flex;
        height: 30px;
        background: var(--r-surface-2);
        border-radius: 4px;
        overflow: hidden;
        align-items: stretch;
      }
      .bi-compound-seg {
        display: flex;
        align-items: center;
        padding: 0 10px;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0,0,0,0.25);
        white-space: nowrap;
        overflow: hidden;
        transition: width 800ms cubic-bezier(.2,.8,.2,1);
        min-width: 0;
        box-shadow: inset -1px 0 0 rgba(255,255,255,0.22);
      }
      .bi-compound-seg:last-child { box-shadow: none; }
      .bi-compound-seg-onetime { background: #D97706; }
      .bi-compound-seg-rec { background: #1D4ED8; }
      .bi-compound-seg-rec.is-yr2 { background: #2563EB; }
      .bi-compound-seg-rec.is-yr3 { background: #3B82F6; }
      .bi-compound-total {
        font-size: 18px;
        font-weight: 800;
        color: var(--r-ink);
        letter-spacing: -0.02em;
        text-align: right;
        font-variant-numeric: tabular-nums;
        line-height: 1.05;
      }
      .bi-compound-total small {
        display: block;
        font-size: 10px;
        font-weight: 600;
        color: var(--r-ink-2);
        letter-spacing: normal;
        margin-top: 3px;
      }
      .bi-compound-foot {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        background: linear-gradient(90deg, #F0FDF4 0%, #ECFDF5 100%);
        border-left: 3px solid #047857;
        border-radius: 6px;
        font-size: 12px;
        color: #065F46;
        line-height: 1.55;
        margin-top: 18px;
        padding: 12px 14px;
      }
      .bi-compound-foot b { color: #065F46; font-weight: 800; }
      .bi-compound-foot b:first-of-type { color: #047857; }
      .bi-compound-foot-icon {
        flex-shrink: 0;
        color: #047857;
        margin-top: 1px;
      }

      @media (max-height: 900px) {
        #panel-roi .bi-compound { padding: 14px 18px !important; }
        #panel-roi .bi-compound-hero-num { font-size: 34px !important; }
        #panel-roi .bi-compound-hero-unit { font-size: 15px !important; }
        #panel-roi .bi-compound-hero-suffix { font-size: 14px !important; }
        #panel-roi .bi-compound-sub { font-size: 12px !important; }
        #panel-roi .bi-compound-row { grid-template-columns: 60px 1fr 110px !important; gap: 12px !important; }
        #panel-roi .bi-compound-bar { height: 24px !important; }
        #panel-roi .bi-compound-seg { font-size: 10px !important; padding: 0 6px !important; }
        #panel-roi .bi-compound-total { font-size: 16px !important; }
        #panel-roi .bi-compound-total small { font-size: 9px !important; }
        #panel-roi .bi-compound-foot { font-size: 11px !important; padding: 10px 12px !important; }
        #panel-roi .bi-compound-inputs { padding: 8px 12px !important; margin-bottom: 12px !important; }
      }

      /* ─── Outcomes pillars: Speed / Scale / Risk ───────────────────
         Three stacked cards on the left side of the result split.
         Same white-card + light-border vocabulary as the rest of the
         tab. Accent lives on the left rule only — blue / green /
         amber — so the three categories are distinct without competing
         with the right-hand bar chart. */
      .bi-pillars {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .bi-pillar {
        position: relative;
        background: #fff;
        border: 1px solid var(--r-divider);
        border-left: 6px solid var(--r-blue);
        border-radius: 8px;
        padding: 16px 20px 14px;
        box-shadow: 0 1px 2px rgba(26,26,46,0.05), 0 4px 12px rgba(26,26,46,0.06);
      }
      .bi-pillar.is-speed { border-left-color: var(--r-blue); }
      .bi-pillar.is-scale { border-left-color: var(--r-green); }
      .bi-pillar.is-risk  { border-left-color: var(--r-amber); }
      .bi-pillar-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .bi-pillar-eyebrow {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--r-blue);
        background: rgba(0, 0, 204, 0.09);
        padding: 3px 7px 2px;
        border-radius: 3px;
        line-height: 1;
      }
      .is-scale .bi-pillar-eyebrow { color: var(--r-green); background: rgba(15, 122, 63, 0.10); }
      .is-risk  .bi-pillar-eyebrow { color: var(--r-amber); background: rgba(204, 136, 0, 0.12); }
      .bi-pillar-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--r-ink);
        margin: 0;
        line-height: 1.2;
        letter-spacing: -0.005em;
      }
      .bi-pillar-hero {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 14px;
        margin: 0 -6px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 204, 0.045);
      }
      .is-scale .bi-pillar-hero { background: rgba(15, 122, 63, 0.055); }
      .is-risk  .bi-pillar-hero { background: rgba(204, 136, 0, 0.065); }
      .bi-pillar-hero-num {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: var(--r-blue);
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .is-scale .bi-pillar-hero-num { color: var(--r-green); }
      .is-risk  .bi-pillar-hero-num { color: var(--r-amber); }
      .bi-pillar-hero-num.bi-pillar-hero-text {
        font-size: 22px;
        letter-spacing: -0.015em;
        font-variant-numeric: normal;
        line-height: 1.15;
      }
      .bi-pillar-hero-unit {
        font-size: 15px;
        font-weight: 700;
        color: inherit;
        letter-spacing: 0;
      }
      .bi-pillar-hero-sub {
        font-size: 12px;
        font-weight: 600;
        color: var(--r-ink-2);
        line-height: 1.45;
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
        flex-wrap: wrap;
      }
      .bi-pillar-hero-note {
        font-size: 11px;
        font-weight: 500;
        color: var(--r-ink-2);
        opacity: 0.85;
        font-style: italic;
      }
      .bi-pillar-rows {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .bi-pillar-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        font-size: 12px;
        line-height: 1.4;
      }
      .bi-pillar-row-lbl {
        color: var(--r-ink-2);
        font-weight: 600;
        flex-shrink: 0;
      }
      .bi-pillar-row-val {
        font-weight: 700;
        color: var(--r-ink);
        font-variant-numeric: tabular-nums;
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .bi-pillar-row-val-single {
        font-weight: 700;
        color: var(--r-ink);
      }
      .bi-pillar-from {
        color: var(--r-ink-2);
        font-weight: 600;
      }
      .bi-pillar-arrow {
        color: var(--r-ink-2);
        font-weight: 700;
      }
      .bi-pillar-to {
        color: var(--r-blue);
        font-weight: 800;
      }
      .is-scale .bi-pillar-to { color: var(--r-green); }
      .is-risk  .bi-pillar-to { color: var(--r-amber); }
      .bi-pillar-tag {
        font-size: 10px;
        font-weight: 800;
        padding: 1px 6px;
        border-radius: 3px;
        background: rgba(15, 122, 63, 0.10);
        color: var(--r-green);
        letter-spacing: 0;
      }
      .bi-pillars-foot {
        margin: 10px 2px 0;
        font-size: 11px;
        color: var(--r-ink-2);
        font-style: italic;
      }
      @media (max-height: 900px) {
        #panel-roi .bi-pillars { gap: 10px !important; }
        #panel-roi .bi-pillar { padding: 13px 16px 11px !important; }
        #panel-roi .bi-pillar-head { margin-bottom: 8px !important; }
        #panel-roi .bi-pillar-hero { padding: 8px 12px !important; margin: 0 -4px 9px !important; }
        #panel-roi .bi-pillar-hero-num { font-size: 28px !important; }
        #panel-roi .bi-pillar-hero-num.bi-pillar-hero-text { font-size: 18px !important; }
        #panel-roi .bi-pillar-hero-unit { font-size: 13px !important; }
        #panel-roi .bi-pillar-hero-sub { font-size: 11px !important; }
        #panel-roi .bi-pillar-title { font-size: 13px !important; }
        #panel-roi .bi-pillar-row { font-size: 11px !important; gap: 10px !important; }
        #panel-roi .bi-pillar-rows { gap: 5px !important; }
        #panel-roi .bi-pillars-foot { font-size: 10px !important; margin-top: 6px !important; }
      }

      /* ─── Side-by-side split: Ongoing × 3-year horizon ─── */
      /* Default to stacked so narrow viewports remain readable. */
      .bi-split {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .bi-split-col {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      /* Pin the eyebrow header heights so both columns line up at the top. */
      .bi-split-col > .bi-section-eyebrow {
        min-height: 22px;
        margin-bottom: 8px;
      }
      /* Drop side-by-side in only when the panel has comfortable room for both
         charts at once. Below this width, fall back to the stacked default. */
      @media (min-width: 1100px) {
        .bi-split:not(.is-single) { grid-template-columns: 1fr 1fr; }

        /* Stretch column cards so the right side matches the left's
           natural height (no ragged bottoms when the panel sits side-by-side). */
        .bi-split:not(.is-single) .bi-split-col > .bi-compare {
          flex: 1;
          display: flex;
          flex-direction: column;
        }
        /* Stretch the outcomes pillars stack on the left to match the
           right-hand bar chart's natural height. */
        .bi-split:not(.is-single) .bi-split-col > .bi-pillars { flex: 1; }
        /* Year rows expand and distribute to fill any spare vertical space. */
        .bi-split:not(.is-single) .bi-compound-rows {
          flex: 1;
          justify-content: space-around;
          min-height: 0;
        }
        .bi-split:not(.is-single) .bi-compare { padding: 16px 18px; }
        .bi-split:not(.is-single) .bi-compare-head {
          margin-bottom: 12px;
          padding-bottom: 10px;
        }
        .bi-split:not(.is-single) .bi-compare-row {
          grid-template-columns: 124px 1fr 86px;
          gap: 12px;
          padding: 9px 0;
        }
        .bi-split:not(.is-single) .bi-compare-axis {
          grid-template-columns: 124px 1fr 86px;
          gap: 12px;
        }
        .bi-split:not(.is-single) .bi-compare-label { font-size: 12px; }
        .bi-split:not(.is-single) .bi-compare-label-sub { font-size: 10px; margin-top: 2px; }
        .bi-split:not(.is-single) .bi-compare-stat-pct { font-size: 16px; }
        .bi-split:not(.is-single) .bi-compare-stat-sub { font-size: 10px; }
        /* Anchor the green reduction band to the bottom of the card. */
        .bi-split:not(.is-single) .bi-compare-summary {
          margin: 12px -18px -16px;
          padding: 12px 18px;
          font-size: 12px;
          margin-top: auto;
        }
        .bi-split:not(.is-single) .bi-compare-summary-from,
        .bi-split:not(.is-single) .bi-compare-summary-to { font-size: 16px; }
        .bi-split:not(.is-single) .bi-compare-summary-pct { font-size: 19px; }

        .bi-split:not(.is-single) .bi-compound { padding: 16px 18px; }
        .bi-split:not(.is-single) .bi-compound-head {
          margin-bottom: 14px;

      function renderPipeline(){
        const sc = STATE.flowScenarioIdx;

          const lastIdx = idx.indexOf(stagePhases[stagePhases.length - 1]);
          if (currentIdx > lastIdx) return 'reached';
          if (stagePhases.includes(phase)) return 'active-stage';
          return '';
        };
        const progressPct = !scenario ? 0 :
          phase === 'clicking' ? 8 : phase === 'checking' ? 28 :
          phase === 'routing' ? 48 : phase === 'config' ? 68 :

                          <div class="flex-1"><div class="upd-bar ${['config','done','final'].includes(phase) ? 'filling' : ''}"></div></div>
                          <span class="px-1.5 py-0.5 rounded ${['done','final'].includes(phase) ? 'bg-green-50 border border-green-200 text-green-600' : 'bg-slate-50 border border-slate-200 text-slate-400'} text-[10px]">v2.2</span>

                  ${scenario.dtap ? `
                  <div class="pipeline-stage ${stageState(['config','done','final'])}">

                            ${['config','done','final'].includes(phase) ? '<div class="text-[7px]">' + (i < scenario.dtap.current ? '\u2713' : i === scenario.dtap.current ? scenario.dtap.version : '') + '</div>' : ''}

      function clearFlowTimers(){
        if (!STATE.flowTimers) STATE.flowTimers = { intervals: [], timeouts: [] };
        STATE.flowTimers.intervals.forEach(id => clearInterval(id));
        STATE.flowTimers.timeouts.forEach(id => clearTimeout(id));
        STATE.flowTimers.intervals = [];
        STATE.flowTimers.timeouts = [];
      }

      function buildFlowQueue(){
        const queue = [];
        // Honor the UX scenario picker — the user can lead the demo with
        // whichever scenario fits the buyer in the room. Falls back to 0.
        const idx = (typeof STATE.uxScenarioIdx === 'number' && STATE.uxScenarioIdx >= 0 && STATE.uxScenarioIdx < SCENARIOS.length)
          ? STATE.uxScenarioIdx : 0;
        const isCatalog = SCENARIOS[idx] && SCENARIOS[idx].id === 'catalog';
        // Launch phase: user opens Application Workspace on their device
        queue.push({ delay: 600, fn(){ STATE.flowScenarioIdx = idx; STATE.flowPhase = 'launch'; STATE.flowAppOpened = false; updateFlowDOM(); } });
        // Catalog phase: workspace opens, user sees all their apps
        queue.push({ delay: 1200, fn(){ STATE.flowPhase = 'catalog'; updateFlowDOM(); } });
        // Clicking phase: user selects an app from the catalog
        queue.push({ delay: 1500, fn(){ STATE.flowPhase = 'clicking'; updateFlowDOM(); } });
        queue.push({ delay: 1200, fn(){ STATE.flowPhase = 'checking'; updateFlowDOM(); animateChecks(); } });
        queue.push({ delay: 2000, fn(){ STATE.flowPhase = 'routing'; updateFlowDOM(); } });
        queue.push({ delay: 1500, fn(){ STATE.flowPhase = 'config'; updateFlowDOM(); } });
        queue.push({ delay: 1500, fn(){ STATE.flowPhase = 'done'; if (isCatalog) { STATE._firstOpenDone = false; STATE.flowAppOpened = true; } updateFlowDOM(); } });
        queue.push({ delay: 2000, fn(){ STATE.flowPhase = 'final'; updateFlowDOM(); } });
        queue.push({ delay: 3000, fn(){ STATE.flowRunning = false; STATE.flowPaused = false; updateFlowDOM(); } });
        return queue;
      }

      function runFlowQueue(){
        if (STATE.flowPaused || STATE.flowQueueIdx >= STATE.flowQueue.length) return;
        const step = STATE.flowQueue[STATE.flowQueueIdx];
        const tid = setTimeout(() => {
          if (STATE.flowPaused) return;
          step.fn();
          STATE.flowQueueIdx++;
          runFlowQueue();
        }, step.delay);
        STATE.flowTimers.timeouts.push(tid);
      }

      function scrollPreserveRender(){
        const mainEl = document.querySelector('body > #app > main');
        const mainScrollTop = mainEl ? mainEl.scrollTop : 0;
        const winScrollTop = window.scrollY || document.documentElement.scrollTop || 0;
        render();
        const newMainEl = document.querySelector('body > #app > main');
        if (newMainEl) newMainEl.scrollTop = mainScrollTop;
        if (winScrollTop > 0) {
          document.documentElement.scrollTop = winScrollTop;
          document.body.scrollTop = winScrollTop;
        }
      }

      function startFlow(){
        if (STATE.flowRunning) return;
        clearFlowTimers();
        STATE.flowRunning = true;
        STATE.flowPaused = false;
        STATE.flowScenarioIdx = 0;
        STATE.flowPhase = 'idle';
        STATE.flowAppOpened = false;
        STATE._firstOpenDone = false;
        STATE._acSeen = {};
        STATE.flowQueue = buildFlowQueue();
        STATE.flowQueueIdx = 0;
        scrollPreserveRender();
        runFlowQueue();
      }

      function pauseFlow(){
        if (!STATE.flowRunning) return;
        STATE.flowPaused = true;
        STATE.flowTimers.timeouts.forEach(id => clearTimeout(id));
        STATE.flowTimers.timeouts = [];
        scrollPreserveRender();
      }

      function resumeFlow(){
        if (!STATE.flowRunning || !STATE.flowPaused) return;
        STATE.flowPaused = false;
        scrollPreserveRender();
        runFlowQueue();
      }

      function animateChecks(){
        const items = document.querySelectorAll('.check-item');
        items.forEach((item, i) => {
          const tid = setTimeout(() => {
            if (STATE.flowPaused) return;
            item.classList.add('pass');
            const ico = item.querySelector('[data-lucide]');
            if (ico) {
              ico.setAttribute('data-lucide', 'check-circle');
              if (window.lucide?.createIcons) try { window.lucide.createIcons(); } catch {}
            }
          }, i * 350);
          STATE.flowTimers.timeouts.push(tid);
        });
      }

      function updateFlowDOM(){
        if (STATE.activeTab !== 'solution') { render(); return; }
        const panelSection = document.querySelector('main > section');
        if (!panelSection) { render(); return; }
        panelSection.innerHTML = renderSolution();
        if (window.lucide?.createIcons) try { window.lucide.createIcons(); } catch {}
      }

      function resetFlow(){
        clearFlowTimers();
        STATE.flowStep = -1;
        STATE.flowRunning = false;
        STATE.flowPaused = false;
        STATE.flowScenarioIdx = -1;
        STATE.flowPhase = 'idle';
        STATE.flowQueue = [];
        STATE.flowQueueIdx = 0;
        STATE.flowAppOpened = false;
        STATE._firstOpenDone = false;
        STATE._acSeen = {};
        STATE.flowDevice = null;
        render();
      }

      function stepFlow(){
        if (STATE.flowRunning) return;
        if (!STATE.flowDevice) STATE.flowDevice = 'multi';
        if (!STATE.flowQueue || STATE.flowQueue.length === 0) {
          STATE.flowQueue = buildFlowQueue();
          STATE.flowQueueIdx = 0;
          STATE.flowPhase = 'idle';
          STATE.flowPaused = true;
        }
        if (STATE.flowQueueIdx >= STATE.flowQueue.length) return;
        const step = STATE.flowQueue[STATE.flowQueueIdx];
        step.fn();
        STATE.flowQueueIdx++;
      }

      function startAppCascade(){
        STATE.autopilotAppCount = 0;
        let count = 0;
        const cascadeInterval = setInterval(() => {
          count++;
          STATE.autopilotAppCount = count;
          // Targeted DOM updates -  no full re-render during rapid cascade
          const counterEl = document.getElementById('ap-app-counter');
          if (counterEl) counterEl.textContent = count + '/' + AP_APPS.length;
          const stepCounter = document.getElementById('ap-step-counter');
          if (stepCounter) stepCounter.textContent = count;
          const grid = document.getElementById('ap-cascade-grid');
          if (grid) {
            const icon = grid.children[count - 1];
            if (icon) {
              icon.classList.add('visible');
              // Replace placeholder with colored icon
              const app = AP_APPS[count - 1];
              icon.innerHTML = '<div class="ap-app-sq" style="background:' + app.c + '">' + app.l + '</div>';
            }
          }
          if (count >= AP_APPS.length) {
            clearInterval(cascadeInterval);
            if (counterEl) { counterEl.classList.add('done'); }
            const frame = document.getElementById('ap-device-frame');
            if (frame) frame.classList.add('ap-wow-glow');
          }
        }, 40);
        STATE.flowTimers.intervals.push(cascadeInterval);
