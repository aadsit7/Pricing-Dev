                  <div class="bi-assumptions-grid">
                    ${roiInput('roi-users','users','Managed users','End users in scope','5000',ci.users)}
                    ${roiInput('roi-endpoints','monitor','Endpoints','Devices in scope','6000',ci.endpoints)}
                    ${roiInput('roi-envs','layers','Environments','Intune, SCCM, VDI, Jamf, etc.','3',ci.envs)}
                    ${roiInput('roi-apps','layout-grid','Active apps','Apps actively managed','150',ci.apps)}
                    ${roiInput('roi-custom','package','Custom / internal apps','Internally packaged','30',ci.customApps)}
                    ${roiInput('roi-tickets','ticket','Monthly app tickets','App tickets/mo','600',ci.monthlyTickets)}
                    ${roiInput('roi-ticketmins','clock','Avg ticket time (min)','Minutes per ticket','18',ci.avgTicketMins)}
                    ${roiInput('roi-pkghrs','wrench','Packaging hrs/mo','Package + repackage','80',ci.pkgHours)}
                    ${roiInput('roi-patchhrs','refresh-cw','Patching hrs/mo','Validate + deploy','60',ci.patchHours)}
                  </div>
                  <div class="bi-assumptions-title" style="margin-top:16px">Reduction rates (%)</div>
                  <div class="bi-assumptions-grid four">
                    <label class="bi-rate"><span>Ticket reduction</span><input type="number" id="asn-ticket" min="0" max="100" value="${Math.round(a.ticketReduction * 100)}"></label>
                    <label class="bi-rate"><span>Catalog packaging</span><input type="number" id="asn-pkg-catalog" min="0" max="100" value="${Math.round(a.catalogPkgReduction * 100)}"></label>
                    <label class="bi-rate"><span>Custom packaging</span><input type="number" id="asn-pkg-custom" min="0" max="100" value="${Math.round(a.customPkgReduction * 100)}"></label>
                    <label class="bi-rate"><span>Patching reduction</span><input type="number" id="asn-patch" min="0" max="100" value="${Math.round(a.patchReduction * 100)}"></label>
                    <label class="bi-rate"><span>Strategic reallocation</span><input type="number" id="asn-strategic" min="0" max="100" value="${Math.round(a.strategicRealloc * 100)}"></label>
                  </div>
                  <div class="bi-assumptions-title" style="margin-top:16px">Support-hours allocation (%) — drives UX / Dashboarding / Multi-tenant bars</div>
                  <div class="bi-assumptions-grid">
                    <label class="bi-rate"><span>User experience</span><input type="number" id="asn-ux" min="0" max="100" value="${Math.round(a.uxShare * 100)}"></label>
                    <label class="bi-rate"><span>Dashboarding</span><input type="number" id="asn-dash" min="0" max="100" value="${Math.round(a.dashShare * 100)}"></label>
                    <label class="bi-rate"><span>Multi-tenant</span><input type="number" id="asn-mt" min="0" max="100" value="${Math.round(a.mtShare * 100)}"></label>
                  </div>
                  <div class="bi-assumptions-title" style="margin-top:16px">Packaging cycle inputs — drives Packaging cycle ROI card</div>
                  <div class="bi-assumptions-grid">
                    <label class="bi-rate"><span>Complex-app mix (%)</span><input type="number" id="asn-complex-mix" min="0" max="100" value="${Math.round(ci.complexMixPct ?? 20)}"></label>
                    <label class="bi-rate"><span>Loaded engineer rate ($/hr)</span><input type="number" id="asn-loaded-rate" min="0" value="${ci.loadedRate || 95}"></label>
                  </div>
                  <div class="bi-assumptions-title" style="margin-top:16px">Per-app benchmarks (hrs) — defaults from Recast field test</div>
                  <div class="bi-assumptions-grid four">
                    <label class="bi-rate"><span>AW · standard app</span><input type="number" id="asn-aw-std" min="0" step="0.01" value="${PACKAGING_BENCHMARKS.awStdHrs}"></label>
                    <label class="bi-rate"><span>AW · complex app</span><input type="number" id="asn-aw-cmp" min="0" step="0.1" value="${PACKAGING_BENCHMARKS.awComplexHrs}"></label>
                    <label class="bi-rate"><span>Traditional · standard</span><input type="number" id="asn-trad-std" min="0" step="0.01" value="${PACKAGING_BENCHMARKS.tradStdHrs}"></label>
                    <label class="bi-rate"><span>Traditional · complex</span><input type="number" id="asn-trad-cmp" min="0" step="0.1" value="${PACKAGING_BENCHMARKS.tradComplexHrs}"></label>
                  </div>
                  <div class="bi-assumptions-actions">
                    <button type="button" data-action="save-assumptions" class="bi-assumptions-save">Save &amp; Recalculate</button>
                    <button type="button" data-action="toggle-assumptions" class="bi-assumptions-close">Close</button>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- STEP 2 — Results -->
            ${tooSmall ? `
              <div class="bi-toosmall">
                <div class="bi-toosmall-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
                <div>
                  <div class="bi-toosmall-title">Under 200 employees? You likely don't need this.</div>
                  <div class="bi-toosmall-body">Organizations under 200 typically don't face the multi-platform complexity Application Workspace addresses. The per-platform model usually works fine at that scale.</div>
                </div>
              </div>
            ` : hasResult ? `<div id="impact-results">${renderCalcResult()}</div>` : `
              <div class="bi-empty">
                <div class="bi-empty-visual">
                  <div class="bi-empty-bar" style="height:22%"></div>
                  <div class="bi-empty-bar" style="height:48%"></div>
                  <div class="bi-empty-bar" style="height:72%"></div>
                  <div class="bi-empty-bar" style="height:96%"></div>
                </div>
                <div class="bi-empty-title">Enter your employee count to see your impact</div>
                <div class="bi-empty-body">We'll model hours returned, FTE capacity freed, and where it goes — calibrated to your environment in seconds.</div>
              </div>
            `}

            ${hasResult ? `
              <div class="bi-actionbar">
                ${STATE.pdfCompanyInput ? `
                  <div class="bi-pdf-input">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--r-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <input type="text" id="pdf-company-input" placeholder="Enter company name" value="${STATE.pdfCompanyName}">
                    <button type="button" data-action="submit-pdf-company" class="bi-pdf-submit">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                    <span data-action="cancel-pdf-input" class="bi-pdf-cancel">×</span>
                  </div>
                ` : `
                  <button type="button" data-action="open-pdf-input" class="bi-action-primary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/></svg>
                    Download Executive Summary
                  </button>
                `}
                <button type="button" data-action="open-ai-agent" class="bi-action-secondary">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                  Ask a question
                </button>
              </div>
            ` : ''}
          </section>
        `;
      }

      function renderCalcResult(){
        const r = STATE.calcResult;
        const a = ROI_ASSUMPTIONS[STATE.calcScenario];
        const ci = STATE.calcInputs;

        // ── 5-bar distribution, partitioning the engine's raw pools ──
        // The bars represent the same pools the engine adds up
        // (currentSupportHoursRaw + pkgHours + patchHours), so on raw
        // values the parts sum to the whole exactly. To keep that true
        // after rounding, we apply largest-remainder rounding with the
        // bar totals locked to the engine's headline.
        //
        // Packaging is split by app-mix into catalog/custom pools with
        // distinct reduction rates (catalog collapses much harder than
        // custom). Patching shares the same catalog/custom split for
        // display but applies a single uniform patch reduction.
        const apps = Math.max(1, ci.apps);
        const customShare = Math.min(1, ci.customApps / apps);
        const catalogShare = 1 - customShare;
        // Support hours split across UX, dashboarding, multi-tenant — from assumptions.
        // Normalized so the three always sum to 1, even if the user enters off-totals.
        const rawSum = (a.uxShare + a.dashShare + a.mtShare) || 1;
        const uxShare = a.uxShare / rawSum;
        const dashShare = a.dashShare / rawSum;
        const mtShare = a.mtShare / rawSum;

        // Hover narratives for each row — longer-form explanations of
        // why this pool collapses with AW, written for a sales-facing
        // audience. Surfaced via the row's `title` tooltip.
        const BAR_NARRATIVES = {
          'Managed apps':     'Vendor apps come pre-built from the Recast Setup Store — Recast packages, tests, and keeps each one current, so new versions apply automatically instead of being repackaged by hand.',
          'Custom packaging': 'Your in-house apps are packaged once with reusable install, update, and detection logic, then delivered through the same automation engine — no manual scripting per environment.',
          'User experience':  'Users install what they need on demand from one self-service catalog with single sign-on — instant access and far fewer help-desk tickets for installs and logins.',
          'Dashboarding':     'Every action is logged automatically and surfaced through built-in reporting and OData — audit evidence and usage dashboards generate themselves instead of being compiled by hand.',
          'Multi-tenant':     'One package promotes identically across every environment and tenant — build once, get the same result everywhere, with no drift between dev, test, and prod.'
        };

        // Per-pool raw values, sourced from the engine. Patching is
        // excluded from this visualization — it lives in the Risk card's
        // "Patch validation effort" row. The Scale card headline still
        // includes patching reclaim (engine truth); these bars only
        // partition the packaging + support pools that they actually
        // visualize, and the rounding targets are locked to that subset.
        const supRaw    = r.currentSupportHoursRaw;
        const supRetRaw = r.ticketHoursReturnedRaw;

        const barsRaw = [
          { label: 'Managed apps',     sub: 'Catalog + lifecycle',    old: r.catalogPkgHoursRaw,   ret: r.catalogPkgReturnedRaw },
          { label: 'Custom packaging', sub: 'In-house apps',          old: r.customPkgHoursRaw,    ret: r.customPkgReturnedRaw  },
          { label: 'User experience',  sub: 'Self-serve + auth',      old: supRaw * uxShare,       ret: supRetRaw * uxShare     },
          { label: 'Dashboarding',     sub: 'Reporting + audit',      old: supRaw * dashShare,     ret: supRetRaw * dashShare   },
          { label: 'Multi-tenant',     sub: 'Cross-env consistency',  old: supRaw * mtShare,       ret: supRetRaw * mtShare     },
        ].map(b => ({ ...b, neww: Math.max(0, b.old - b.ret) }));

        // Visible totals (excluding patching), used as rounding targets
        // so the bars reconcile to what they actually display.
        const visibleBaselineRaw = supRaw + r.catalogPkgHoursRaw + r.customPkgHoursRaw;
        const visibleReturnedRaw = supRetRaw + r.catalogPkgReturnedRaw + r.customPkgReturnedRaw;
        const visibleReclaim     = Math.round(visibleReturnedRaw);
        const patchingReclaim    = r.patchHoursReturned; // shown as a separate note below the bars

        // Largest-remainder rounding: residuals are absorbed into the
        // rows with the largest fractional parts so the integer parts
        // sum exactly to the integer target.
        function roundToTotal(rawParts, target){
          const fl = rawParts.map(v => Math.floor(v));
          let rem = target - fl.reduce((s,n) => s+n, 0);
          if (rem <= 0) return fl;
          const order = rawParts.map((v,i) => ({ i, frac: v - Math.floor(v) }))
                                .sort((x,y) => y.frac - x.frac);
          for (let k = 0; k < rem && k < order.length; k++) fl[order[k].i]++;
          return fl;
        }

        // Force bar totals to match the engine's visible pools exactly:
        //   sum(oldR) === Math.round(visibleBaselineRaw)
        //   sum(newR) === Math.round(visibleBaselineRaw) − visibleReclaim
        // → sum(oldR) − sum(newR) === visibleReclaim, always.
        const oldTarget = Math.round(visibleBaselineRaw);
        const newTarget = Math.max(0, oldTarget - visibleReclaim);
        const oldR = roundToTotal(barsRaw.map(b => b.old),  oldTarget);
        const newR = roundToTotal(barsRaw.map(b => b.neww), newTarget);

        // Clamp new[i] ≤ old[i]; redistribute any rounding overflow
        // into rows that still have slack (preserves the total).
        for (let i = 0; i < oldR.length; i++) {
          if (newR[i] > oldR[i]) {
            let excess = newR[i] - oldR[i];
            newR[i] = oldR[i];
            for (let j = 0; j < newR.length && excess > 0; j++) {
              if (j === i) continue;
              const slack = oldR[j] - newR[j];
              if (slack > 0) {
                const take = Math.min(slack, excess);
                newR[j] += take;
                excess  -= take;
              }
            }
          }
        }

        const bars = barsRaw.map((b, i) => {
          const oldV = oldR[i];
          const newV = newR[i];
          const reclaimed = oldV - newV;
          const pct = oldV > 0 ? Math.round((reclaimed / oldV) * 100) : 0;
          return { label: b.label, sub: b.sub, narrative: BAR_NARRATIVES[b.label] || '', old: oldV, neww: newV, reclaimed, pct };
        });

        const oldTotal = bars.reduce((s,b) => s + b.old,  0);
        const newTotal = bars.reduce((s,b) => s + b.neww, 0);
        const totalReturned = visibleReclaim; // visible bars only; full engine reclaim is on the Scale card
        const pctReduction = oldTotal ? Math.round((totalReturned / oldTotal) * 100) : 0;
        const ftesAbsorbed = oldTotal && a.fteHours > 0 ? (oldTotal * 12 / a.fteHours).toFixed(1) : '0.0';

        // Scale-card numbers use the full engine reclaim (includes
        // patching). Right-panel bars+summary use the visible-pool
        // reclaim. Both are honest within their scope; the small note
        // under the summary bridges them.
        const fullReclaim = r.totalHoursMonth;
        const fullPctReduction = r.baselineRaw > 0 ? Math.round((fullReclaim / r.baselineRaw) * 100) : 0;

        // Dev guardrail — fails loudly if engine and bar partition ever diverge.
        console.assert(
          oldTotal - newTotal === visibleReclaim,
          'bars do not reconcile to visible reclaim',
          { barReclaim: oldTotal - newTotal, visibleReclaim }
        );

        // Nice axis ceiling for the chart (round up to a clean tick).
        const axisMax = Math.max(...bars.map(b => b.old), 10);
        const niceCeil = (n) => {
          const tiers = [10, 20, 50, 100, 150, 200, 300, 500, 1000];
          for (const t of tiers) { if (n <= t) return t; }
          return Math.ceil(n / 500) * 500;
        };
        const axisCeil = niceCeil(axisMax);
        const tickCount = axisCeil <= 50 ? 6 : (axisCeil <= 150 ? 8 : 6);
        const tickStep = axisCeil / (tickCount - 1);
        const ticks = Array.from({length: tickCount}, (_, i) => Math.round(i * tickStep));

        const barRow = (b) => {
          const detail = `${num(b.old)} hrs today → ${num(b.neww)} hrs with App Workspace (−${b.pct}%, ${num(b.reclaimed)} hrs reclaimed)`;
          const narrative = b.narrative ? `\n\n${b.narrative}` : '';
          const tip = `${b.label} · ${b.sub}\n${detail}${narrative}`;
          return `
          <div class="bi-compare-row" title="${tip.replace(/"/g, '&quot;')}">
            <div class="bi-compare-label">
              ${b.label}
              <span class="bi-compare-label-sub">${b.sub}</span>
            </div>
            <div class="bi-compare-pair">
              <div class="bi-compare-bar">
                <div class="bi-compare-bar-fill is-old" style="width:${(b.old / axisCeil) * 100}%"></div>
                <div class="bi-compare-bar-value">${num(b.old)} hrs</div>
              </div>
              <div class="bi-compare-bar">
                <div class="bi-compare-bar-fill is-new" style="width:${(b.neww / axisCeil) * 100}%"></div>
                <div class="bi-compare-bar-value">${num(b.neww)} hrs</div>
              </div>
            </div>
            <div class="bi-compare-stat">
              <span class="bi-compare-stat-pct${b.pct === 0 ? ' is-flat' : ''}">${b.pct > 0 ? '−' : ''}${b.pct}%</span>
              <span class="bi-compare-stat-sub">${num(b.reclaimed)} hrs reclaimed</span>
            </div>
          </div>`;
        };

        // ─── SPEED / SCALE / RISK card derivations ───────────────────
        // Every value below feeds the same r/ci/a state that drives the
        // right-hand "Where time gets returned" panel — both update
        // together on Recalculate or assumption edits, so the two
        // columns can never show inconsistent numbers. Only two values
        // are new derivations: blended per-app build time (Speed hero)
        // and reclaimed-hour dollar value (Scale hero sub).
        const pb = PACKAGING_BENCHMARKS;
        const complexMix  = Math.max(0, Math.min(1, (ci.complexMixPct ?? 20) / 100));
        const standardMix = 1 - complexMix;
        const tradBlended = standardMix * pb.tradStdHrs + complexMix * pb.tradComplexHrs;
        const awBlended   = standardMix * pb.awStdHrs   + complexMix * pb.awComplexHrs;
        const pctFaster   = tradBlended > 0 ? Math.round((1 - awBlended / tradBlended) * 100) : 0;

        const loadedRate = r.rate;
        const reclaimedDollarsAnnual = r.totalRecoveredAnnual; // engine value, no recompute
        const fmtDollarsK = (n) => '$' + Math.round(n / 1000).toLocaleString() + 'K';

        // Cross-platform touchpoints — same formula the removed env
        // picker used, driven by ci.envs and a fixed 50% coverage (a
        // typical app lives on ~half the platforms in a stack).
        const ENV_COVERAGE = 0.5;
        const streamsToday = Math.max(ci.apps, Math.round(ci.apps * ci.envs * ENV_COVERAGE));
        const streamsAw    = ci.apps;
        const touchpointReduction = streamsToday > 0 ? Math.max(0, Math.round(((streamsToday - streamsAw) / streamsToday) * 100)) : 0;

        // After-state hours read from the engine, not recomputed — so the
        // row totals match `pkgHoursReturned` / `patchHoursReturned` exactly.
        const pkgAfter   = Math.max(0, ci.pkgHours   - r.pkgHoursReturned);
        const patchAfter = Math.max(0, ci.patchHours - r.patchHoursReturned);
        const dashRow    = bars.find(b => b.label === 'Dashboarding') || { old: 0, neww: 0 };
        const envsLabel  = ci.envs === 1 ? 'env' : 'envs';

        return `
          <div class="bi-split">
            <!-- OUTCOMES — Speed / Scale / Risk (left side: the headline story) -->
            <section class="bi-split-col">
              <div class="bi-section-eyebrow">Outcomes &middot; speed, scale, risk</div>
              <div class="bi-pillars">

                <article class="bi-pillar is-speed">
                  <header class="bi-pillar-head">
                    <span class="bi-pillar-eyebrow">Speed</span>
                    <h3 class="bi-pillar-title">Time to deliver</h3>
                  </header>
                  <div class="bi-pillar-hero">
                    <div class="bi-pillar-hero-num">&minus;${pctFaster}<span class="bi-pillar-hero-unit">%</span></div>
                    <div class="bi-pillar-hero-sub">
                      per-app build time &middot;
                      <span class="bi-pillar-from">${tradBlended.toFixed(1)} hrs</span>
                      <span class="bi-pillar-arrow">&rarr;</span>
                      <span class="bi-pillar-to">${awBlended.toFixed(1)} hrs</span>
                    </div>
                  </div>
                  <ul class="bi-pillar-rows">
                    <li class="bi-pillar-row">
                      <span class="bi-pillar-row-lbl">Builds per release</span>
                      <span class="bi-pillar-row-val">
                        <span class="bi-pillar-from">${ci.envs}</span>
                        <span class="bi-pillar-arrow">&rarr;</span>
                        <span class="bi-pillar-to">1</span>
                      </span>
                    </li>
                    <li class="bi-pillar-row">
                      <span class="bi-pillar-row-lbl">User access</span>
                      <span class="bi-pillar-row-val">
                        <span class="bi-pillar-from">days</span>
                        <span class="bi-pillar-arrow">&rarr;</span>
                        <span class="bi-pillar-to">&lt;1 min</span>
                      </span>
                    </li>
                    <li class="bi-pillar-row">
                      <span class="bi-pillar-row-lbl">Patch window</span>
                      <span class="bi-pillar-row-val">
                        <span class="bi-pillar-from">5&ndash;10 days</span>
                        <span class="bi-pillar-arrow">&rarr;</span>
                        <span class="bi-pillar-to">day-zero</span>
                      </span>
                    </li>
                  </ul>
                </article>

                <article class="bi-pillar is-scale">
                  <header class="bi-pillar-head">
                    <span class="bi-pillar-eyebrow">Scale</span>
                    <h3 class="bi-pillar-title">Capacity reclaimed</h3>
                  </header>
                  <div class="bi-pillar-hero">
                    <div class="bi-pillar-hero-num">${num(fullReclaim)}<span class="bi-pillar-hero-unit"> hrs/mo</span></div>
                    <div class="bi-pillar-hero-sub">
                      &asymp; <span class="bi-pillar-to">${fmtDollarsK(reclaimedDollarsAnnual)}/yr</span>
                      &middot; <span class="bi-pillar-to">&minus;${fullPctReduction}%</span>
                      <span class="bi-pillar-hero-note">of operational hours</span>
                    </div>
                  </div>
                  <ul class="bi-pillar-rows">
                    <li class="bi-pillar-row">
                      <span class="bi-pillar-row-lbl">Packaging effort</span>
                      <span class="bi-pillar-row-val">
                        <span class="bi-pillar-from">${num(ci.pkgHours)} hrs/mo</span>
                        <span class="bi-pillar-arrow">&rarr;</span>
                        <span class="bi-pillar-to">${num(pkgAfter)} hrs/mo</span>
                      </span>
                    </li>
                    <li class="bi-pillar-row">
                      <span class="bi-pillar-row-lbl">Delivery touchpoints</span>
                      <span class="bi-pillar-row-val">
                        <span class="bi-pillar-from">${num(streamsToday)}</span>
                        <span class="bi-pillar-arrow">&rarr;</span>
                        <span class="bi-pillar-to">${num(streamsAw)}</span>
                        <span class="bi-pillar-tag">&minus;${touchpointReduction}%</span>
                      </span>
                    </li>
                    <li class="bi-pillar-row">
                      <span class="bi-pillar-row-lbl">Engineer time</span>
                      <span class="bi-pillar-row-val">
                        <span class="bi-pillar-from">repetitive packaging</span>
                        <span class="bi-pillar-arrow">&rarr;</span>
                        <span class="bi-pillar-to">strategy</span>
                      </span>
                    </li>
                  </ul>
                </article>

                <article class="bi-pillar is-risk">
                  <header class="bi-pillar-head">
                    <span class="bi-pillar-eyebrow">Risk</span>
                    <h3 class="bi-pillar-title">Audit-ready by default</h3>
                  </header>
                  <div class="bi-pillar-hero">
                    <div class="bi-pillar-hero-num bi-pillar-hero-text">Per-action log</div>
                    <div class="bi-pillar-hero-sub">replaces manual evidence &middot; every change captured</div>
                  </div>
                  <ul class="bi-pillar-rows">
                    <li class="bi-pillar-row">
                      <span class="bi-pillar-row-lbl">Reporting + audit effort</span>
                      <span class="bi-pillar-row-val">
                        <span class="bi-pillar-from">${num(dashRow.old)} hrs/mo</span>
                        <span class="bi-pillar-arrow">&rarr;</span>
                        <span class="bi-pillar-to">${num(dashRow.neww)} hrs/mo</span>
                      </span>
                    </li>
                    <li class="bi-pillar-row">
                      <span class="bi-pillar-row-lbl">Patch validation effort</span>
                      <span class="bi-pillar-row-val">

      function calculateImpact(){
        const ci = STATE.calcInputs;
        const a = ROI_ASSUMPTIONS[STATE.calcScenario];
        const rate = ci.loadedRate || 95; // single editable loaded rate, used everywhere

        // ── Raw (unrounded) values are the canonical source of truth ──
        // Every monthly-hours figure flows from these. We round only on output
        // so rounded parts can never disagree with the rounded whole.
        const currentSupportHoursRaw = (ci.monthlyTickets * ci.avgTicketMins) / 60;
        const ticketHoursReturnedRaw = currentSupportHoursRaw * a.ticketReduction;

        // Packaging is two distinct pools — catalog/store apps collapse
        // near-completely; custom apps still need engineering. Split the
        // pool by app share, apply per-pool reductions, then recombine.
        const totalApps    = Math.max(0, ci.apps);
        const customApps   = Math.max(0, Math.min(ci.customApps, totalApps));
        const customShare  = totalApps > 0 ? customApps / totalApps : 0;
        const catalogShareEngine = 1 - customShare;
        const catalogPkgHoursRaw    = ci.pkgHours * catalogShareEngine;
        const customPkgHoursRaw     = ci.pkgHours * customShare;
        const catalogPkgReturnedRaw = catalogPkgHoursRaw * a.catalogPkgReduction;
        const customPkgReturnedRaw  = customPkgHoursRaw  * a.customPkgReduction;
        const pkgHoursReturnedRaw   = catalogPkgReturnedRaw + customPkgReturnedRaw;
        const blendedPkgReduction   = ci.pkgHours > 0 ? (pkgHoursReturnedRaw / ci.pkgHours) : 0;

        const patchHoursReturnedRaw  = ci.patchHours * a.patchReduction;
        const totalReturnedRaw       = ticketHoursReturnedRaw + pkgHoursReturnedRaw + patchHoursReturnedRaw;
        const baselineRaw            = currentSupportHoursRaw + ci.pkgHours + ci.patchHours;

        // ── Rounded outputs (display-only) ──
        const currentSupportHours = Math.round(currentSupportHoursRaw);
        const ticketHoursReturned = Math.round(ticketHoursReturnedRaw);
        const ticketsAvoided      = Math.round(ci.monthlyTickets * a.ticketReduction);
        const pkgHoursReturned    = Math.round(pkgHoursReturnedRaw);
        const patchHoursReturned  = Math.round(patchHoursReturnedRaw);
        const totalHoursMonth     = Math.round(totalReturnedRaw); // canonical monthly reclaim
        const totalHoursYear      = Math.round(totalReturnedRaw * 12);
        const fteCapacity         = a.fteHours > 0 ? Math.round(totalHoursYear / a.fteHours) : 0;
        const strategicHours      = Math.round(totalHoursYear * a.strategicRealloc);
        const reqsDeferred        = ci.openReqs > 0 ? Math.min(ci.openReqs, Math.floor(fteCapacity)) : 0;
        const delayedInitiatives  = ci.delayedInitiatives;

        // ── Dollars: one declared rate for every figure ──
        // Replaces the previous hardcoded $90 (support) / $120 (engineering)
        // mix with the single editable Assumptions rate so all $ values agree.
        const supportCostAnnual     = Math.round(currentSupportHoursRaw * rate * 12);
        const engineeringCostAnnual = Math.round((ci.pkgHours + ci.patchHours) * rate * 12);
        const wasteCostAnnual       = Math.round((supportCostAnnual + engineeringCostAnnual) * 0.25);
        const totalBurnAnnual       = supportCostAnnual + engineeringCostAnnual + wasteCostAnnual;
        const totalRecoveredAnnual  = Math.round(totalReturnedRaw * rate * 12);
        const monthlyCostOfWaiting  = Math.round(totalRecoveredAnnual / 12);

        // ── Packaging cycle ROI (field-test model) ──
        // Standard_Apps  = Total_Apps × (1 − complex%);   Complex_Apps = Total_Apps × complex%
        // AW_Hours       = (Std × awStd) + (Complex × awComplex)
        // Trad_Hours     = (Std × tradStd) + (Complex × tradComplex)
        // Hours_Saved    = Trad − AW;   Time_Multiple = Trad ÷ AW;   $_Saved = Hours_Saved × loadedRate
        const pb = PACKAGING_BENCHMARKS;
        const complexMix = Math.max(0, Math.min(1, (ci.complexMixPct ?? 20) / 100));
        const standardMix = 1 - complexMix;
        const cycleStandardApps = Math.round(ci.apps * standardMix);
        const cycleComplexApps  = Math.max(0, ci.apps - cycleStandardApps);
        const awCycleHours      = (cycleStandardApps * pb.awStdHrs)   + (cycleComplexApps * pb.awComplexHrs);
        const tradCycleHours    = (cycleStandardApps * pb.tradStdHrs) + (cycleComplexApps * pb.tradComplexHrs);
        const cycleHoursSaved   = Math.max(0, tradCycleHours - awCycleHours);
        const cycleTimeMultiple = awCycleHours > 0 ? (tradCycleHours / awCycleHours) : 0;
        const cycleDollarsSaved = Math.round(cycleHoursSaved * (ci.loadedRate || 95));

        // ── Investment vs Return (full 3-year financial model) ──
        // Investment is real list pricing; value is recurring annual savings + one-time packaging cycle savings.
        // Payback nets the one-time packaging windfall against the first-year subscription, then divides by monthly recurring savings.
        const awAnnualInvestment = awAnnualCost(ci.users);
        const recurringAnnualValue = totalRecoveredAnnual;
        const oneTimePackagingValue = cycleDollarsSaved;
        const year1Value = recurringAnnualValue + oneTimePackagingValue;
        const year1Net = year1Value - awAnnualInvestment;
        const year1ROIMultiple = awAnnualInvestment > 0 ? (year1Value / awAnnualInvestment) : 0;
        const recurringROIMultiple = awAnnualInvestment > 0 ? (recurringAnnualValue / awAnnualInvestment) : 0;
        const netUpfrontCost = Math.max(0, awAnnualInvestment - oneTimePackagingValue);
        const paybackMonths = recurringAnnualValue > 0
          ? (netUpfrontCost / (recurringAnnualValue / 12))
          : 0;
        const threeYearValue = (recurringAnnualValue * 3) + oneTimePackagingValue;
        const threeYearInvestment = awAnnualInvestment * 3;
        const threeYearNet = threeYearValue - threeYearInvestment;
        const awBlendedPerUserMonth = ci.users > 0 ? (awAnnualInvestment / 12 / ci.users) : 0;

        STATE.calcResult = {
          // Display-rounded fields the view reads directly.
          currentSupportHours, ticketHoursReturned, ticketsAvoided, pkgHoursReturned, patchHoursReturned,
          totalHoursMonth, totalHoursYear, fteCapacity, strategicHours, reqsDeferred, delayedInitiatives,
          supportCostAnnual, engineeringCostAnnual, wasteCostAnnual, totalBurnAnnual,
          totalRecoveredAnnual, monthlyCostOfWaiting,
          cycleStandardApps, cycleComplexApps, awCycleHours, tradCycleHours, cycleHoursSaved,
          cycleTimeMultiple, cycleDollarsSaved,
          awAnnualInvestment, recurringAnnualValue, oneTimePackagingValue, year1Value, year1Net,
          year1ROIMultiple, recurringROIMultiple, paybackMonths,
          threeYearValue, threeYearInvestment, threeYearNet, awBlendedPerUserMonth,
          // Raw fields the bar partition reads to stay in lockstep with the engine.
          currentSupportHoursRaw, ticketHoursReturnedRaw, pkgHoursReturnedRaw, patchHoursReturnedRaw,
          totalReturnedRaw, baselineRaw, rate,
          // Per-pool packaging split + blended pct (used by bars and the PDF).
          catalogPkgHoursRaw, customPkgHoursRaw, catalogPkgReturnedRaw, customPkgReturnedRaw,
          blendedPkgReduction
        };
      }

              } else if (t === 'ob') {
                if (action === 'toggle-flow') {
                  if (!STATE.obRunning) { startOb(); }
                  else if (anyActive) { STATE.obPaused = true; clearTimers(); }
                  else if (STATE.obPaused) { STATE.obPaused = false; runObQueue(); }
                } else if (action === 'step-flow') { stepOb(); }
                else if (action === 'reset-flow') { resetOb(); }
              }
            });

            scrollPreserveRender();
            return;
          }
          if (action === 'toggle-admin-view') { STATE.showAdminView = !STATE.showAdminView; scrollPreserveRender(); return; }
          if (action === 'toggle-autopilot') { STATE.showAutopilot = !STATE.showAutopilot; STATE.autopilotStep = -1; STATE.autopilotAppCount = 0; clearFlowTimers(); scrollPreserveRender(); return; }
          if (action === 'start-autopilot') {
            if (STATE.autopilotStep >= 0) return;
            STATE.autopilotStep = 0; STATE.autopilotAppCount = 0; scrollPreserveRender();
            const apQueue = [
              { delay: 1800, fn(){ STATE.autopilotStep = 1; scrollPreserveRender(); } },
              { delay: 1800, fn(){ STATE.autopilotStep = 2; scrollPreserveRender(); } },
              { delay: 1800, fn(){ STATE.autopilotStep = 3; scrollPreserveRender(); } },
              { delay: 1800, fn(){ STATE.autopilotStep = 4; scrollPreserveRender(); } },
              { delay: 1800, fn(){ STATE.autopilotStep = 5; scrollPreserveRender(); } },
              { delay: 1800, fn(){ STATE.autopilotStep = 6; scrollPreserveRender(); startAppCascade(); } },
              { delay: 2500, fn(){ STATE.autopilotStep = 7; scrollPreserveRender(); } },
            ];
            let qIdx = 0;
            function runApQueue(){
              if (qIdx >= apQueue.length) return;
              const step = apQueue[qIdx];
              const tid = setTimeout(() => { step.fn(); qIdx++; runApQueue(); }, step.delay);
              STATE.flowTimers.timeouts.push(tid);
            }
            runApQueue();
            return;
          }
          if (action === 'reset-autopilot') { clearFlowTimers(); STATE.autopilotStep = -1; STATE.autopilotAppCount = 0; scrollPreserveRender(); return; }

          if (action === 'open-pdf-input') { STATE.pdfCompanyInput = true; render(); setTimeout(() => { const el = document.getElementById('pdf-company-input'); if (el) el.focus(); }, 50); return; }
          if (action === 'cancel-pdf-input') { STATE.pdfCompanyInput = false; render(); return; }
          if (action === 'submit-pdf-company') { const input = document.getElementById('pdf-company-input'); const name = (input?.value || '').trim() || 'Your Organization'; STATE.pdfCompanyName = name; generatePDF(name); STATE.pdfCompanyInput = false; render(); return; }

          if (action === 'open-currentstate-editor') {
            STATE.modalOpen = true; STATE.editTab = 'change';
            STATE.editBuffers = { change: { intro: '', bullets: '', analyst: '' }, now: { intro: '', bullets: '', analyst: '' }, recast: { intro: '', bullets: '', analyst: '' } };
            STATE.editChartBuffer = null; render();
            setTimeout(()=>{ try { window.lucide?.createIcons?.(); } catch{} }, 0);
            setTimeout(()=>{ initCurrentStateModal(); }, 0); return;
          }

          if (action === 'switch-edit-tab') { STATE.editTab = act.getAttribute('data-tab'); render(); setTimeout(()=>{ try { window.lucide?.createIcons?.(); } catch{} }, 0); return; }

          if (action === 'save-currentstate') {
            const fallback = STATE.defaultsCurrentState(); const formData = readFields();
            const activeKey = STATE.editTab;
            // Only update the section the user is currently editing — leave others untouched
            if (activeKey === 'change' || activeKey === 'now') {
              const fd = formData[activeKey]; const fb = fallback[activeKey];
              STATE.currentState[activeKey] = {
                intro: (fd.intro || '').trim() || fb.intro,
                bullets: parseLines(fd.bullets) || fb.bullets,
                analyst: (fd.analyst || '').trim() || fb.analyst
              };
            }
            saveDraft({ change: { intro: '', bullets: STATE.currentState.change.bullets.join('\n'), analyst: STATE.currentState.change.analyst }, now: { intro: '', bullets: STATE.currentState.now.bullets.join('\n'), analyst: STATE.currentState.now.analyst }, recast: { intro: STATE.currentState.recast.intro, bullets: STATE.currentState.recast.bullets.join('\n'), analyst: STATE.currentState.recast.analyst }, chartConfig: { ...STATE.chartConfig }, drivers: STATE.drivers.map(d => ({ label: d.label, bullets: d.bullets.join('\n') })) });
            STATE.modalOpen = false; STATE.activeTab = 'problems'; render(); return;
          }

          if (action === 'reset-currentstate-defaults') { clearDraft(); const defaults = STATE.defaultsCurrentState(); STATE.currentState.change = defaults.change; STATE.currentState.now = defaults.now; STATE.editBuffers = { change: { intro: '', bullets: '', analyst: '' }, now: { intro: '', bullets: '', analyst: '' }, recast: { intro: '', bullets: '', analyst: '' } }; render(); return; }
          if (action === 'reset-sliders') { resetSliders(); return; }
        });

        root.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { const flipTarget = e.target.closest('[data-action="flip-card"]'); if (flipTarget) { flipTarget.click(); e.preventDefault(); } } });

        let _roiDebounce = null;
        root.addEventListener('input', (e) => {
          if (e.target?.id === 'roi-employees') { const n = cleanNum(e.target.value); if (n > 0) { deriveFromEmployees(n); calculateImpact(); clearTimeout(_roiDebounce); _roiDebounce = setTimeout(() => render(), 600); } return; }
          if (e.target?.id === 'roi-users') { STATE.calcInputs.users = cleanNum(e.target.value); return; }
          if (e.target?.id === 'roi-endpoints') { STATE.calcInputs.endpoints = cleanNum(e.target.value); return; }
          if (e.target?.id === 'roi-envs') { STATE.calcInputs.envs = cleanNum(e.target.value); return; }
          if (e.target?.id === 'roi-apps') { STATE.calcInputs.apps = cleanNum(e.target.value); return; }
          if (e.target?.id === 'roi-custom') { STATE.calcInputs.customApps = cleanNum(e.target.value); return; }
          if (e.target?.id === 'roi-tickets') { STATE.calcInputs.monthlyTickets = cleanNum(e.target.value); return; }
          if (e.target?.id === 'roi-ticketmins') { STATE.calcInputs.avgTicketMins = cleanNum(e.target.value); return; }
          if (e.target?.id === 'roi-pkghrs') { STATE.calcInputs.pkgHours = cleanNum(e.target.value); return; }
          if (e.target?.id === 'roi-patchhrs') { STATE.calcInputs.patchHours = cleanNum(e.target.value); return; }
          if (e.target?.id === 'roi-reqs') { STATE.calcInputs.openReqs = cleanNum(e.target.value); return; }
          if (e.target?.id === 'roi-initiatives') { STATE.calcInputs.delayedInitiatives = cleanNum(e.target.value); return; }
          if (e.target?.id === 'asn-complex-mix') { STATE.calcInputs.complexMixPct = Math.max(0, Math.min(100, cleanNum(e.target.value))); return; }
          if (e.target?.id === 'asn-loaded-rate') { STATE.calcInputs.loadedRate = Math.max(0, cleanNum(e.target.value)); return; }
          // Inline packaging-cycle levers — live update + debounced re-render so the bars and KPIs follow keystrokes.
          if (e.target?.id === 'pkg-apps') { STATE.calcInputs.apps = Math.max(0, cleanNum(e.target.value)); calculateImpact(); clearTimeout(_roiDebounce); _roiDebounce = setTimeout(() => render(), 500); return; }
          if (e.target?.id === 'pkg-mix')  { STATE.calcInputs.complexMixPct = Math.max(0, Math.min(100, cleanNum(e.target.value))); calculateImpact(); clearTimeout(_roiDebounce); _roiDebounce = setTimeout(() => render(), 500); return; }
          if (e.target?.id === 'pkg-rate') { STATE.calcInputs.loadedRate = Math.max(0, cleanNum(e.target.value)); calculateImpact(); clearTimeout(_roiDebounce); _roiDebounce = setTimeout(() => render(), 500); return; }
          const buf = e.target.closest('[data-action="edit-buffer"]');
          if (buf) { const key = buf.getAttribute('data-key'); const sub = buf.getAttribute('data-subkey'); if (STATE.editBuffers?.[key]) STATE.editBuffers[key][sub] = e.target.value; }
          if (STATE.modalOpen && STATE.editTab === 'chart') { STATE.editChartBuffer = readChartFieldsRaw(); }
        });
        const pdfInput = document.getElementById('pdf-company-input');
        if (pdfInput) { pdfInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); const name = (pdfInput.value || '').trim() || 'Your Organization'; STATE.pdfCompanyName = name; generatePDF(name); STATE.pdfCompanyInput = false; render(); } }); }
      }

      let accordionKeyboardBound = false;
      function attachAccordionKeyboard(){
        if (accordionKeyboardBound) return; accordionKeyboardBound = true;
        document.addEventListener('keydown', (e) => {
          const target = e.target; if (!target || !target.classList || !target.classList.contains('accordion-header')) return;
          const headers = Array.from(document.querySelectorAll('.accordion-header')); const idx = headers.indexOf(target);
          if (e.key === 'ArrowDown') { headers[(idx + 1) % headers.length]?.focus(); e.preventDefault(); }
          else if (e.key === 'ArrowUp') { headers[(idx - 1 + headers.length) % headers.length]?.focus(); e.preventDefault(); }
          else if (e.key === 'Home') { headers[0]?.focus(); e.preventDefault(); }
          else if (e.key === 'End') { headers[headers.length - 1]?.focus(); e.preventDefault(); }
          else if (e.key === 'Enter' || e.key === ' ') { target.click(); e.preventDefault(); }
        });
      }

      STATE.drivers.forEach(d => d.state = 'accelerating');
      STATE.showTippingPoint = true;
      updateCurves();
      STATE.currentDemandExponent = STATE.targetDemandExponent;
      STATE.currentCapacitySlope = STATE.targetCapacitySlope;

      deriveFromEmployees(STATE.calcInputs.users);
      calculateImpact();
      document.addEventListener('DOMContentLoaded', render);
      document.addEventListener('keydown',(e)=>{
        if (STATE.insightContent && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
          const tag = (e.target && e.target.tagName) || '';
          if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
          const pool = (STATE.drivers || []).filter(d => d.id);
          if (!pool.length) return;
          const dir = e.key === 'ArrowRight' ? 1 : -1;
          const curId = STATE.insightContent.id || STATE.highlightDriverId;
          const curIdx = pool.findIndex(d => d.id === curId);
          if (curIdx === -1) return;
          const nextIdx = (curIdx + dir + pool.length) % pool.length;
          openInsight(pool[nextIdx]);
          e.preventDefault();
          return;
        }
        if(e.key==='Escape' && (STATE.modalOpen || STATE.openWhyModal || STATE.insightContent || STATE.showAnalystModal || STATE.showAIAgent)){ if (STATE.openWhyModal && STATE._savedDriverStates) { STATE.drivers.forEach((d, i) => { d.state = STATE._savedDriverStates[i]; }); STATE.showTippingPoint = STATE._savedTippingPoint; STATE.recastMode = STATE._savedRecastMode; STATE.targetDemandExponent = STATE._savedDemandExp; STATE.targetCapacitySlope = STATE._savedCapSlope; STATE._savedDriverStates = null; updateCurves(); requestAnimationFrame(animateCurves); } STATE.modalOpen=false; STATE.openWhyModal=null; STATE.insightContent=null; STATE.highlightDriverId=null; STATE.showAnalystModal=false; STATE.showAIAgent=false; render(); }
      });
    </script>
  </body>
</html>
