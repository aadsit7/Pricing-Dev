      .ac-dots { display: flex; gap: 5px; }
      .ac-url { flex: 1; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 4px; background: #fff; border: 1px solid #cbd5e1; font-size: 10px; color: #475569; min-width: 0; }
      .ac-url i { width: 11px; height: 11px; color: #10b981; flex-shrink: 0; }
      .ac-url .ac-url-path { color: #94a3b8; }
      .ac-url .ac-url-page { color: #0A1C60; font-weight: 600; }

      /* App top bar (Recast wordmark + tabs) */
      .ac-topbar { display: flex; align-items: stretch; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; height: 38px; }
      .ac-topbar-brand { display: flex; align-items: center; padding: 0 22px 0 18px; flex-shrink: 0; }
      .ac-topbar-brand-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; color: #2563EB; letter-spacing: -0.02em; line-height: 1; }
      .ac-topbar-tabs { display: flex; align-items: stretch; gap: 0; flex: 1; min-width: 0; }
      .ac-topbar-tab { display: inline-flex; align-items: center; padding: 0 18px; font-size: 12px; font-weight: 500; color: #64748B; border-bottom: 2px solid transparent; line-height: 1; cursor: default; }
      .ac-topbar-tab.is-active { color: #2563EB; border-bottom-color: #2563EB; font-weight: 600; }
      .ac-topbar-user { display: grid; place-items: center; padding: 0 14px; flex-shrink: 0; color: #94A3B8; }
      .ac-topbar-user i { width: 18px; height: 18px; }

      /* Body: 3-pane (group rail · sub-nav · workspace) */
      .ac-body { display: flex; min-height: 540px; background: #F4F6FA; }

      /* Group rail (left, light gray, sectioned) */
      .ac-rail { width: 158px; flex-shrink: 0; background: #F4F6FA; border-right: 1px solid #E2E8F0; padding: 4px 0 14px; overflow: hidden; }
      .ac-rail-section { padding: 8px 0 6px; }
      .ac-rail-section + .ac-rail-section { border-top: 1px solid #E5E7EB; }
      .ac-rail-section-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 14px 4px 14px; }
      .ac-rail-section-label { display: inline-flex; align-items: center; gap: 6px; font-size: 9.5px; font-weight: 600; color: #94A3B8; letter-spacing: 0.05em; text-transform: uppercase; }
      .ac-rail-section-label i { width: 11px; height: 11px; color: #94A3B8; opacity: 0.9; }
      .ac-rail-section-caret { width: 10px; height: 10px; color: #94A3B8; }
      .ac-rail-item { display: flex; align-items: center; gap: 9px; padding: 4px 14px 4px 18px; font-size: 11.5px; color: #475569; line-height: 1.2; cursor: default; border-left: 2px solid transparent; }
      .ac-rail-item i { width: 13px; height: 13px; flex-shrink: 0; color: #94A3B8; opacity: 0.95; }
      .ac-rail-item.is-active { color: #0F172A; font-weight: 600; background: #E2EAF7; border-left-color: #2563EB; }
      .ac-rail-item.is-active i { color: #2563EB; opacity: 1; }

      /* Sub-nav column (white, package's own pages) */
      .ac-subnav { width: 168px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E2E8F0; display: flex; flex-direction: column; padding: 0; }
      .ac-subnav-toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid #E2E8F0; height: 34px; }
      .ac-subnav-tool { width: 18px; height: 18px; display: grid; place-items: center; color: #94A3B8; }
      .ac-subnav-tool i { width: 13px; height: 13px; }
      .ac-subnav-pkghead { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #F1F5F9; }
      .ac-subnav-pkgicon { width: 20px; height: 20px; border-radius: 4px; background: linear-gradient(135deg, #5B53D6, #4F4DC8); color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 800; flex-shrink: 0; }
      .ac-subnav-pkgname { font-size: 12px; font-weight: 600; color: #0F172A; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ac-subnav-list { padding: 6px 0 10px; flex: 1; }
      .ac-subnav-group-label { padding: 8px 12px 4px; font-size: 11px; font-weight: 600; color: #94A3B8; letter-spacing: 0.01em; }
      .ac-subnav-item { display: flex; align-items: center; gap: 9px; padding: 5px 12px 5px 22px; font-size: 11.5px; color: #475569; line-height: 1.2; cursor: default; border-right: 2px solid transparent; }
      .ac-subnav-item i { width: 12px; height: 12px; flex-shrink: 0; color: #94A3B8; }
      .ac-subnav-item.is-active { color: #2563EB; font-weight: 600; background: #EFF4FE; border-right-color: #2563EB; }
      .ac-subnav-item.is-active i { color: #2563EB; }

      /* Workspace */
      .ac-work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .ac-work-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border-bottom: 1px solid #E2E8F0; background: #FFFFFF; height: 34px; }
      .ac-crumb { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #64748B; min-width: 0; }
      .ac-crumb-sep { color: #CBD5E1; }
      .ac-crumb-active { color: #2563EB; font-weight: 600; }
      .ac-crumb-tools { display: inline-flex; align-items: center; gap: 12px; color: #94A3B8; }
      .ac-crumb-tools i { width: 14px; height: 14px; }

      .ac-pkgrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; background: #FFFFFF; }
      .ac-pkgrow-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .ac-pkgrow-icon { width: 24px; height: 24px; border-radius: 5px; background: linear-gradient(135deg, #5B53D6, #4F4DC8); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
      .ac-pkgrow-name { font-size: 13px; font-weight: 600; color: #0F172A; line-height: 1.2; }
      .ac-pkgrow-create { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #2563EB; background: transparent; border: 0; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
      .ac-pkgrow-create i { width: 13px; height: 13px; }

      /* Lifecycle stepper (chevron arrows) */
      .ac-lifecycle { display: flex; align-items: stretch; padding: 4px 16px 14px; gap: 6px; background: #FFFFFF; opacity: 0; transform: translateY(-4px); transition: opacity 0.5s ease, transform 0.5s ease; }
      .ac-lifecycle.is-shown { opacity: 1; transform: translateY(0); }
      .ac-lc-step { position: relative; flex: 1; height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 18px; background: #FFFFFF; color: #94A3B8; font-size: 11.5px; font-weight: 500; border: 1px solid #EEF2F6; border-radius: 0; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%); transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease; }
      .ac-lc-step:first-child { clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); padding-left: 14px; }
      .ac-lc-step:last-child { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 12px 50%); }
      .ac-lc-step.is-active { background: linear-gradient(180deg, #3B82F6 0%, #2563EB 100%); color: #FFFFFF; border-color: #2563EB; box-shadow: 0 1px 2px rgba(37,99,235,0.14); font-weight: 600; }
      .ac-lc-step.is-active .ac-lc-step-num { background: rgba(255,255,255,0.22); color: #FFFFFF; }
      .ac-lc-step.is-promoted { background: #EEF4FE; color: #3B82F6; border-color: #DBE7FE; }
      .ac-lc-step.is-promoted .ac-lc-step-num { background: #DBE7FE; color: #3B82F6; }
      .ac-lc-step-num { width: 22px; height: 22px; border-radius: 999px; background: #F1F5F9; color: #475569; display: grid; place-items: center; flex-shrink: 0; }
      .ac-lc-step-num i { width: 12px; height: 12px; }
      .ac-lc-step-meta { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
      .ac-lc-step-version { font-size: 9.5px; font-weight: 600; opacity: 0.85; letter-spacing: 0.04em; text-transform: uppercase; }
      .ac-lc-step-name { font-size: 12px; font-weight: 700; letter-spacing: -0.005em; }
      .ac-lc-promote-flash { animation: ac-lc-promote 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
      @keyframes ac-lc-promote {
        0%   { box-shadow: 0 0 0 0 rgba(37,99,235,0.0); }
        30%  { box-shadow: 0 0 0 6px rgba(37,99,235,0.22); transform: translateY(-1px); }
        100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); transform: translateY(0); }
      }

      /* Action sets workspace */
      .ac-canvas { flex: 1; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; opacity: 0; transition: opacity 0.4s ease; background: #F4F6FA; }
      .ac-canvas.is-shown { opacity: 1; }
      .ac-section-title { font-size: 13px; font-weight: 600; color: #475569; letter-spacing: 0; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }
      .ac-actiongrid { display: flex; flex-direction: column; gap: 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 6px; overflow: hidden; }
      .ac-actiongrid-head { display: grid; grid-template-columns: 24px 1.6fr 1fr 1fr 1.2fr 30px; gap: 12px; padding: 8px 14px; background: #F8FAFC; color: #64748B; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 1px solid #E2E8F0; }
      .ac-actiongrid-row { display: grid; grid-template-columns: 24px 1.6fr 1fr 1fr 1.2fr 30px; gap: 12px; align-items: center; padding: 9px 14px; font-size: 12px; color: #1E293B; opacity: 0; transform: translateY(3px); transition: opacity 0.45s ease, transform 0.45s ease, background 0.4s ease; transition-delay: var(--ac-d, 0ms); border-bottom: 1px solid #F1F5F9; }
      .ac-actiongrid-row:last-child { border-bottom: 0; }
      .ac-actiongrid-row.is-shown { opacity: 1; transform: translateY(0); }
      .ac-actiongrid-row.is-fresh { background: #ECFDF5; animation: ac-row-fresh 1.6s ease-out; }
      @keyframes ac-row-fresh { 0% { background: #BBF7D0; } 100% { background: #ECFDF5; } }
      .ac-actiongrid-cell-handle { color: #CBD5E1; display: grid; place-items: center; }
      .ac-actiongrid-cell-handle i { width: 14px; height: 14px; }
      .ac-actiongrid-cell-name { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #0F172A; min-width: 0; }
      .ac-actiongrid-cell-name i { width: 13px; height: 13px; color: #64748B; flex-shrink: 0; }
      .ac-actiongrid-cell-type { color: #475569; }
      .ac-actiongrid-cell-target { color: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ac-actiongrid-cell-filters { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
      .ac-actiongrid-cell-more { color: #CBD5E1; display: grid; place-items: center; }
      .ac-actiongrid-cell-more i { width: 14px; height: 14px; }
      .ac-filter-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: 500; background: #F1F5FB; color: #475569; border: 1px solid #E2E8F0; }
      .ac-filter-chip i { width: 9px; height: 9px; color: #94A3B8; }
      .ac-status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: 700; background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; letter-spacing: 0.02em; }
      .ac-status-pill.is-active { background: #DCFCE7; color: #166534; border-color: #86EFAC; }
      .ac-status-pill i { width: 9px; height: 9px; }

      /* Floating "Create action" modal */
      .ac-modal-overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.32); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); display: grid; place-items: center; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.32s ease; }
      .ac-modal-overlay.is-open { opacity: 1; pointer-events: auto; }
      .ac-modal { width: min(440px, calc(100% - 36px)); background: #FFFFFF; border-radius: 8px; box-shadow: 0 20px 50px -10px rgba(15,23,42,0.32), 0 4px 16px rgba(15,23,42,0.18); overflow: hidden; transform: translateY(8px) scale(0.985); transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
      .ac-modal-overlay.is-open .ac-modal { transform: translateY(0) scale(1); }
      .ac-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; background: #2563EB; color: #FFFFFF; }
      .ac-modal-title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
      .ac-modal-close { color: rgba(255,255,255,0.85); display: grid; place-items: center; cursor: pointer; }
      .ac-modal-close i { width: 16px; height: 16px; }
      .ac-modal-tabs { display: flex; gap: 0; padding: 0 16px; background: #F4F6FA; border-bottom: 1px solid #E2E8F0; }
      .ac-modal-tab { padding: 9px 14px; font-size: 12px; font-weight: 600; color: #64748B; border-bottom: 2px solid transparent; line-height: 1.2; cursor: default; }
      .ac-modal-tab.is-active { color: #2563EB; border-bottom-color: #2563EB; background: #FFFFFF; }
      .ac-modal-body { padding: 14px 16px 4px; max-height: 360px; overflow: hidden; }
      .ac-field { margin-bottom: 11px; opacity: 0; transform: translateY(4px); transition: opacity 0.5s ease, transform 0.5s ease; transition-delay: var(--ac-d, 0ms); }
      .ac-field.is-shown { opacity: 1; transform: translateY(0); }
      .ac-field-label { display: block; font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 4px; letter-spacing: 0; }
      .ac-field-label .ac-field-req { color: #DC2626; margin-left: 2px; }
      .ac-field-input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid #CBD5E1; border-radius: 4px; background: #FFFFFF; font-size: 12px; color: #0F172A; line-height: 1; display: flex; align-items: center; gap: 8px; transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease; position: relative; }
      .ac-field-input.is-typing { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); background: #FAFCFE; }
      .ac-field-input.has-value { color: #0F172A; }
      .ac-field-input.is-empty { color: #94A3B8; }
      .ac-field-input.is-select::after { content: ''; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid #94A3B8; margin-left: auto; flex-shrink: 0; }
      .ac-field-input-text { flex: 1; min-width: 0; font-family: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ac-field-input.is-typing .ac-field-input-text::after { content: ''; display: inline-block; width: 1.5px; height: 13px; background: #2563EB; margin-left: 1px; vertical-align: -2px; animation: ac-caret 0.9s steps(2) infinite; }
      @keyframes ac-caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .ac-field-aux { display: flex; gap: 6px; align-items: stretch; }
      .ac-field-aux > .ac-field-input { flex: 1; }
      .ac-field-aux-btn { width: 30px; height: 34px; border: 1px solid #CBD5E1; border-radius: 4px; background: #FFFFFF; color: #94A3B8; display: grid; place-items: center; flex-shrink: 0; }
      .ac-field-aux-btn i { width: 14px; height: 14px; }
      .ac-field-aux-folder { background: #F97316; border-color: #F97316; color: #FFFFFF; }
      .ac-modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid #F1F5F9; background: #FFFFFF; }
      .ac-modal-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 18px; border-radius: 4px; font-size: 12px; font-weight: 600; line-height: 1.2; cursor: pointer; border: 1px solid transparent; }
      .ac-modal-btn-primary { background: #2563EB; color: #FFFFFF; border-color: #2563EB; box-shadow: 0 1px 2px rgba(37,99,235,0.18); }
      .ac-modal-btn-primary.is-pulsing { animation: ac-btn-pulse 1s ease-out 1; }
      @keyframes ac-btn-pulse { 0% { box-shadow: 0 0 0 0 rgba(37,99,235,0.5); } 50% { box-shadow: 0 0 0 8px rgba(37,99,235,0); } 100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); } }
      .ac-modal-btn-ghost { background: transparent; color: #475569; }

      /* Cursor (mock pointer that drives the demo) */
      .ac-cursor { position: absolute; width: 18px; height: 18px; pointer-events: none; z-index: 50; transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease; opacity: 0; }
      .ac-cursor.is-shown { opacity: 1; }
      .ac-cursor svg { width: 100%; height: 100%; filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.35)); }
      .ac-cursor.is-clicking::after { content: ''; position: absolute; left: 9px; top: 9px; width: 6px; height: 6px; border-radius: 9999px; background: rgba(37, 99, 235, 0.45); animation: ac-cursor-click 0.5s ease-out forwards; }
      @keyframes ac-cursor-click { 0% { transform: scale(0.4); opacity: 1; } 100% { transform: scale(5); opacity: 0; } }

      /* Empty state */
      .ac-empty { padding: 80px 20px; text-align: center; color: #94A3B8; }
      .ac-empty i { width: 30px; height: 30px; margin-bottom: 10px; color: #CBD5E1; }
      .ac-empty strong { color: #475569; }

      /* Caption ribbon (explains what's happening) */
      .ac-caption { position: absolute; left: 16px; right: 16px; bottom: 12px; background: rgba(255, 255, 255, 0.96); color: #1E293B; padding: 10px 14px; border-radius: 8px; font-size: 12px; line-height: 1.35; display: flex; align-items: flex-start; gap: 9px; box-shadow: 0 6px 20px rgba(15,23,42,0.10), 0 1px 3px rgba(15,23,42,0.06); border: 1px solid #E2E8F0; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transform: translateY(6px); transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none; }
      .ac-caption.is-shown { opacity: 1; transform: translateY(0); }
      .ac-caption-dot { width: 7px; height: 7px; border-radius: 9999px; background: #00BFFF; box-shadow: 0 0 0 3px rgba(0,191,255,0.18); margin-top: 5px; flex-shrink: 0; }
      .ac-caption-text { flex: 1; min-width: 0; }
      .ac-caption-text strong { color: #2563EB; font-weight: 700; }

      @media (max-width: 860px) {
        .ac-rail { width: 130px; }
        .ac-subnav { width: 138px; }
        .ac-actiongrid-head, .ac-actiongrid-row { grid-template-columns: 18px 1.5fr 1fr 1.2fr 26px; }
        .ac-actiongrid-cell-target { display: none; }
      }
      /* Phase status label */
      .phase-status { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; transition: all 0.3s ease; }
      /* Multi-tenant view */
      .mt-zone { border-radius: 10px; padding: 10px; transition: opacity 0.5s ease, transform 0.5s ease; }
      .mt-zone.mt-hidden { opacity: 0; transform: translateY(10px); }
      .mt-zone.mt-visible { opacity: 1; transform: translateY(0); }
      .mt-primary { background: linear-gradient(135deg, #0A1C60 0%, #1e3a8a 100%); color: white; }
      .mt-secondary { background: white; border: 2px solid #0070F3; color: #0A1C60; }
      .mt-sync-line { width: 2px; height: 0; background: linear-gradient(180deg, #0070F3, #10b981); margin: 0 auto; transition: height 0.8s ease; border-radius: 2px; }
      .mt-sync-line.mt-drawn { height: 28px; }
      .mt-app-pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 10px; border: 1px solid #e2e8f0; background: white; color: #475569; transition: all 0.3s ease; }
      .mt-app-pill.mt-custom { border-color: var(--r-divider); background: white; }
      .mt-control { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 4px; font-size: 9px; border: 1px solid #e2e8f0; background: #f8fafc; color: #94a3b8; transition: all 0.3s ease; }
      .mt-control.mt-lit { border-color: #10b981; background: #ecfdf5; color: #065f46; }
      .mt-callout { opacity: 0; transform: translateY(4px); transition: all 0.5s ease; font-size: 10px; font-weight: 600; }
      .mt-callout.mt-show { opacity: 1; transform: translateY(0); }
      /* Dashboard & Reporting view */
      .dr-zone { border-radius: 10px; padding: 10px; transition: opacity 0.5s ease, transform 0.5s ease; }
      .dr-zone.dr-hidden { opacity: 0; transform: translateY(10px); }
      .dr-zone.dr-visible { opacity: 1; transform: translateY(0); }
      .dr-source { background: linear-gradient(135deg, #0A1C60 0%, #1e3a8a 100%); color: white; }
      .dr-panel { background: white; border: 2px solid #0070F3; color: #0A1C60; }
      .dr-feed-line { width: 2px; height: 0; background: linear-gradient(180deg, #0070F3, #8b5cf6); margin: 0 auto; transition: height 0.8s ease; border-radius: 2px; }
      .dr-feed-line.dr-drawn { height: 28px; }
      .dr-endpoint { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 9px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); transition: all 0.4s ease; }
      .dr-endpoint.dr-lit { border-color: rgba(139,92,246,0.6); background: rgba(139,92,246,0.25); color: white; }
      .dr-metric { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 4px; font-size: 9px; border: 1px solid #e2e8f0; background: #f8fafc; color: #94a3b8; transition: all 0.3s ease; }
      .dr-metric.dr-lit { border-color: #0070F3; background: #eff6ff; color: #0A1C60; }
      .dr-callout { opacity: 0; transform: translateY(4px); transition: all 0.5s ease; font-size: 10px; font-weight: 600; }
      .dr-callout.dr-show { opacity: 1; transform: translateY(0); }
      .dr-bar { display: inline-block; width: 6px; border-radius: 2px 2px 0 0; background: #0070F3; transition: height 0.6s ease; }
      .dr-bar.dr-grow { height: var(--h, 12px); }
      .dr-bar:not(.dr-grow) { height: 0; }
      .dr-zone-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 600; border: 1px solid #e2e8f0; background: white; color: #64748b; transition: all 0.4s ease; }
      .dr-zone-badge.dr-active { border-color: #8b5cf6; background: #f5f3ff; color: #6d28d9; }
      .dr-global-badge { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; background: linear-gradient(135deg, #0070F3, #8b5cf6); color: white; box-shadow: 0 2px 8px rgba(0,112,243,0.3); }
      .dr-arrow-line { width: 2px; height: 0; background: linear-gradient(180deg, #8b5cf6, #0070F3); margin: 0 auto; transition: height 0.6s ease; border-radius: 2px; }
      .dr-arrow-line.dr-drawn { height: 20px; }      @keyframes drPulse { 0% { box-shadow: 0 0 0 0 rgba(0,112,243,0); } 50% { box-shadow: 0 0 12px 3px rgba(0,112,243,0.15); } 100% { box-shadow: 0 0 0 0 rgba(0,112,243,0); } }
      .dr-pulse { animation: drPulse 2s ease-in-out infinite; }

      /* ===== AI Copilot view ===== */
      .ai-shell {
        background: #ffffff;
        position: relative;
        overflow: hidden;
      }
      .ai-shell::before {
        content: "";
        position: absolute; inset: -20px -20px auto auto;
        width: 220px; height: 220px;
        background: radial-gradient(circle at 70% 30%, rgba(139,92,246,0.10), transparent 60%);
        pointer-events: none;
      }
      .ai-shell::after {
        content: "";
        position: absolute; left: -40px; bottom: -40px;
        width: 240px; height: 240px;
        background: radial-gradient(circle at 30% 70%, rgba(0,191,255,0.10), transparent 60%);
        pointer-events: none;
      }
      /* Co-branded lockup: Microsoft Copilot + Recast */
      .ai-cobrand-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; margin-bottom: 12px;
        position: relative; z-index: 1;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
      }
      .ai-cobrand {
        display: flex; align-items: center; gap: 10px;
      }
      .ai-copilot-badge {
        display: inline-grid; place-items: center;
        width: 32px; height: 32px;
      }
      .copilot-mark-img { width: 100%; height: 100%; display: block; object-fit: contain; }
      .ai-cobrand-stack {
        display: flex; flex-direction: column;
        line-height: 1.15;
      }
      .ai-cobrand-name {
        font-size: 13px; font-weight: 700;
        color: #0A1C60; letter-spacing: -0.01em;
      }
      .ai-cobrand-sub {
        font-size: 9.5px; font-weight: 500;
        color: #64748b; letter-spacing: 0.02em;
        text-transform: none;
      }
      .ai-cobrand-x {
        font-size: 18px; font-weight: 300;
        color: #cbd5e1;
        margin: 0 4px;
        line-height: 1;
        user-select: none;
      }
      .ai-recast-logo {
        height: 22px; width: auto;
        display: block;
      }
      .ai-recast-text {
        font-family: Inter, -apple-system, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.04em;
        line-height: 1;
        display: inline-block;
      }
      .ai-recast-re { color: #0066FF; }
      .ai-recast-cast { color: #0A1C60; }
      .ai-eyebrow {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
        color: #0A1C60; text-transform: uppercase;
      }
      .ai-spark {
        display: inline-grid; place-items: center;
        width: 18px; height: 18px; border-radius: 5px;
        background: conic-gradient(from 140deg, #0070F3, #8b5cf6, #00BFFF, #0070F3);
        color: #fff;
        box-shadow: 0 4px 10px rgba(139,92,246,0.25);
        animation: aiSparkSpin 6s linear infinite;
      }
      @keyframes aiSparkSpin { to { filter: hue-rotate(40deg); } }
      .ai-tab {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 4px 10px; border-radius: 999px;
        font-size: 10px; font-weight: 600;
        color: #475569; background: #f1f5f9;
        border: 1px solid transparent;
        transition: all 0.2s ease;
      }
      .ai-tab:hover { color: #0A1C60; background: #e0e7ff; }
      .ai-tab.is-active {
        color: #fff;
        background: linear-gradient(135deg, #0070F3 0%, #6d28d9 100%);
        box-shadow: 0 4px 12px rgba(109,40,217,0.25);
      }

      .ai-empty {
        display: flex; flex-direction: column; align-items: center;
        text-align: center; padding: 22px 12px 8px;
        position: relative;
      }
      .ai-empty-orb {
        width: 64px; height: 64px; border-radius: 18px;
        display: grid; place-items: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 28px rgba(109,40,217,0.18);
        margin-bottom: 14px;
        animation: aiOrb 4s ease-in-out infinite;
      }
      .ai-empty-orb .copilot-mark-img { width: 44px; height: 44px; }
      @keyframes aiOrb {
        0%, 100% { transform: scale(1); box-shadow: 0 10px 28px rgba(109,40,217,0.18); }
        50% { transform: scale(1.04); box-shadow: 0 14px 36px rgba(109,40,217,0.28); }
      }
      .ai-empty-title { font-size: 14px; font-weight: 700; color: #0A1C60; margin-bottom: 4px; }
      .ai-empty-sub { font-size: 11px; color: #64748b; max-width: 540px; line-height: 1.5; }
      .ai-empty-chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
      .ai-empty-chip {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 10px; font-weight: 600; color: #475569;
        background: #f8fafc; border: 1px solid #e2e8f0;
        padding: 3px 8px; border-radius: 999px;
      }

      .ai-row { display: flex; gap: 8px; margin-top: 4px; align-items: flex-start; position: relative; z-index: 1; }
      .ai-row-user { justify-content: flex-end; }

      /* Chat turns */
      .ai-chat {
        display: flex; flex-direction: column;
        gap: 14px;
        position: relative; z-index: 1;
      }
      .ai-turn {
        display: flex; flex-direction: column; gap: 4px;
      }
      .ai-turn-meta {
        display: flex; align-items: center; gap: 6px;
        font-size: 10px; color: #64748b;
        font-weight: 500;
      }
      .ai-turn-user .ai-turn-meta {
        justify-content: flex-end;
        padding-right: 36px;
      }
      .ai-turn-bot .ai-turn-meta {
        padding-left: 36px;
      }
      .ai-turn-name { font-weight: 700; color: #0A1C60; }
      .ai-turn-time { color: #94a3b8; }
      .ai-turn-avatar-mini {
        display: inline-grid; place-items: center;
        width: 14px; height: 14px;
      }
      .ai-turn-avatar-mini .copilot-mark-img { width: 14px; height: 14px; }

      .ai-avatar {
        flex-shrink: 0;
        width: 28px; height: 28px; border-radius: 8px;
        display: grid; place-items: center;
        color: #fff;
        overflow: hidden;
      }
      .ai-avatar-user { background: #0A1C60; }
      .ai-avatar-user svg { width: 14px; height: 14px; }
      .ai-avatar-bot {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 2px 8px rgba(109,40,217,0.12);
      }
      .ai-avatar-bot .copilot-mark-img { width: 22px; height: 22px; }
      .ai-avatar-bot.is-thinking { animation: aiPulse 1.4s ease-in-out infinite; }
      @keyframes aiPulse {
        0%, 100% { box-shadow: 0 2px 8px rgba(109,40,217,0.15); }
        50% { box-shadow: 0 2px 16px rgba(109,40,217,0.45); transform: scale(1.06); }
      }

      .ai-bubble {
        max-width: 760px;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 11.5px;
        line-height: 1.5;
      }
      .ai-bubble-user {
        background: #0A1C60; color: #fff;
        border-bottom-right-radius: 4px;
        font-weight: 500;
        max-width: 540px;
      }
      .ai-bubble-bot {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 4px;
        flex: 1;
        /* Reserve space so the bubble doesn't expand visibly between phases */
        min-height: 360px;
      }
      .ai-typed { display: inline; }
      .ai-caret {
        display: inline-block; width: 1px; height: 11px;
        background: #fff; margin-left: 2px; vertical-align: -1px;
        animation: aiCaret 0.7s steps(2) infinite;
      }
      @keyframes aiCaret { 50% { opacity: 0; } }

      /* Inline tool-call card inside the Copilot bubble */
      .ai-toolcall {
        margin-bottom: 10px;
        padding: 6px 10px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-left: 2px solid #8b5cf6;
        border-radius: 6px;
      }
      .ai-toolcall-head {
        display: flex; align-items: center; gap: 6px;
        font-size: 9.5px; font-weight: 700;
        color: #6d28d9;
        text-transform: uppercase; letter-spacing: 0.06em;
        margin-bottom: 5px;
      }
      .ai-toolcall-head svg { color: #8b5cf6; }
      .ai-toolcall-window {
        margin-left: auto;
        font-size: 9px; font-weight: 500;
        color: #94a3b8;
        text-transform: none; letter-spacing: 0;
      }
      .ai-toolcall-chips { display: flex; flex-wrap: wrap; gap: 4px; }

      /* Next-step cue at end of conversation */
      .ai-next-cue {
        margin-top: 4px;
        padding: 10px 14px;
        background: linear-gradient(135deg, #f5f3ff 0%, #eff6ff 100%);
        border: 1px dashed #c4b5fd;
        border-radius: 10px;
        display: flex; align-items: center; gap: 8px;
        font-size: 11px;
        color: #475569;
        animation: aiCueIn 0.5s ease both;
      }
      @keyframes aiCueIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .ai-next-arrow {
        display: inline-grid; place-items: center;
        width: 22px; height: 22px; border-radius: 50%;
        background: #fff;
        color: #6d28d9;
        border: 1px solid #c4b5fd;
        flex-shrink: 0;
      }
      .ai-next-link {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 3px 8px; margin: 0 2px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid #8b5cf6;
        color: #6d28d9;
        font-weight: 700; font-size: 10.5px;
        transition: all 0.2s ease;
      }
      .ai-next-link:hover {
        background: #6d28d9; color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(109,40,217,0.25);
      }

      /* Executive close — quote-style callout after the final scenario */
      .ai-close {
        margin-top: 4px;
        padding: 14px 18px;
        background: #0A1C60;
        color: #fff;
        border-radius: 12px;
        display: flex; align-items: flex-start; gap: 14px;
        position: relative; z-index: 1;
        animation: aiCueIn 0.5s ease both;
      }
      .ai-close-mark {
        width: 32px; height: 32px; flex-shrink: 0;
        background: #fff; border-radius: 8px;
        display: grid; place-items: center;
        padding: 4px;
      }
      .ai-close-mark .copilot-mark-img { width: 24px; height: 24px; }
      .ai-close-body { flex: 1; }
      .ai-close-line {
        font-size: 13px; font-weight: 500;
        line-height: 1.5;
        font-style: italic;
        color: #fff;
        letter-spacing: -0.005em;
      }
      .ai-close-meta {
        margin-top: 8px;
        font-size: 10px; color: #94a3b8;
        font-weight: 500;
      }

      .ai-sources {
        margin: 8px 0 4px;
        padding: 6px 10px;
        background: #fafbff;
        border: 1px dashed #c7d2fe;
        border-radius: 8px;
        display: flex; align-items: center; gap: 10px;
        font-size: 10px; color: #475569;
        position: relative; z-index: 1;
      }
      .ai-sources-label {
        display: inline-flex; align-items: center; gap: 4px;
        font-weight: 700; color: #0A1C60;
        text-transform: uppercase; letter-spacing: 0.06em;
        font-size: 9px;
      }
      .ai-sources-list { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
      .ai-source-chip {
        display: inline-flex; align-items: center; gap: 3px;
        padding: 2px 7px; border-radius: 5px;
        font-size: 9px; font-weight: 600;
        color: #6d28d9; background: #f5f3ff;
        border: 1px solid #c4b5fd;
      }
      .ai-source-chip.is-lit { color: #6d28d9; border-color: #c4b5fd; background: #f5f3ff; }
      .ai-sources-window {
        font-size: 9px; color: #94a3b8;
        white-space: nowrap;
      }

      .ai-thinking {
        display: inline-flex; align-items: center; gap: 4px;
        color: #64748b; font-size: 10.5px;
      }
      .ai-thinking span {
        width: 5px; height: 5px; border-radius: 50%;
        background: #8b5cf6;
        animation: aiDot 1.2s ease-in-out infinite;
      }
      .ai-thinking span:nth-child(2) { animation-delay: 0.15s; }
      .ai-thinking span:nth-child(3) { animation-delay: 0.3s; }
      .ai-thinking em { font-style: normal; margin-left: 4px; }
      @keyframes aiDot {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
        30% { transform: translateY(-3px); opacity: 1; }
      }

      /* ===== Phase-driven reveal system (no DOM rebuild between phases) ===== */
      /* Thinking indicator lives in a slot that slides closed once the answer arrives. */
      .ai-think-slot {
        overflow: hidden;
        max-height: 0; opacity: 0;
        transition: max-height 0.42s cubic-bezier(0.2,0.8,0.2,1), opacity 0.3s ease;
        will-change: max-height, opacity;
      }
      [data-ai-phase="prompt"] .ai-think-slot,
      [data-ai-phase="thinking"] .ai-think-slot { max-height: 30px; opacity: 1; }

      /* Generic reveal: collapsed + hidden until its phase, then grows + fades
         into place via animated height (no layout jump, no DOM rebuild). */
      .ai-reveal {
        box-sizing: border-box;
        opacity: 0;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.55s cubic-bezier(0.2,0.8,0.2,1), opacity 0.4s ease;
        will-change: max-height, opacity;
      }
      [data-ai-phase="sources"] .ai-reveal-sources,
      [data-ai-phase="answer"]  .ai-reveal-sources,
      [data-ai-phase="done"]    .ai-reveal-sources { opacity: 1; max-height: 200px; }
      [data-ai-phase="answer"] .ai-reveal-answer,
      [data-ai-phase="done"]   .ai-reveal-answer { opacity: 1; max-height: 1400px; }

      /* Source chips pop in, staggered (inline transition-delay set per chip). */
      .ai-toolcall-chips .ai-source-chip {
        opacity: 0; transform: translateY(5px) scale(0.95);
        transition: opacity 0.34s ease, transform 0.34s cubic-bezier(0.2,0.8,0.2,1);
      }
      [data-ai-phase="sources"] .ai-toolcall-chips .ai-source-chip,
      [data-ai-phase="answer"]  .ai-toolcall-chips .ai-source-chip,
      [data-ai-phase="done"]    .ai-toolcall-chips .ai-source-chip { opacity: 1; transform: none; }

      /* Insight cards reveal, staggered (inline transition-delay set per card). */
      .ai-insights .ai-insight {
        opacity: 0; transform: translateY(10px);
        transition: opacity 0.42s ease, transform 0.42s cubic-bezier(0.2,0.8,0.2,1);
      }
      [data-ai-phase="answer"] .ai-insights .ai-insight,
      [data-ai-phase="done"]   .ai-insights .ai-insight { opacity: 1; transform: none; }

      @media (prefers-reduced-motion: reduce) {
        .ai-think-slot, .ai-reveal, .ai-toolcall-chips .ai-source-chip,
        .ai-table-row, .ai-insights .ai-insight { transition: none !important; }
        .ai-toolcall-chips .ai-source-chip,
        .ai-table-row, .ai-insights .ai-insight { opacity: 1 !important; transform: none !important; }
      }

      .ai-answer { /* container; children carry the reveal */ }
      .ai-headline {
        font-size: 12.5px; font-weight: 700;
        color: #0A1C60; margin-bottom: 8px;
        letter-spacing: -0.01em;
      }
      /* Scope strip — Environments + Devices the answer spans */
      .ai-scope {
        display: flex; flex-direction: column; gap: 4px;
        margin-bottom: 10px;
        padding: 8px 10px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
      }
      .ai-scope-line {
        display: flex; align-items: center; gap: 8px;
        flex-wrap: wrap;
      }
      .ai-scope-label {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 9px; font-weight: 700;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        flex-shrink: 0;
        min-width: 100px;
      }
      .ai-scope-label svg { color: #0A1C60; }
      .ai-scope-chips {
        display: flex; flex-wrap: wrap; gap: 4px; flex: 1;
      }
      .ai-scope-chip {
        display: inline-flex; align-items: center;
        padding: 2px 8px; border-radius: 999px;
        font-size: 9.5px; font-weight: 600;
        line-height: 1.5;
      }
      .ai-scope-chip-env {
        background: #f0f9ff;
        color: #0A1C60;
        border: 1px solid #bae6fd;
      }
      .ai-scope-chip-dev {
        background: #fafbff;
        color: #4338ca;
        border: 1px solid #c7d2fe;
      }
      .ai-insights {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      }
      .ai-insight {
        display: flex; gap: 8px; align-items: flex-start;
        padding: 8px 10px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-left: 3px solid #cbd5e1;
        border-radius: 6px;
      }
      .ai-insight-icon {
        width: 22px; height: 22px; border-radius: 6px;
        display: grid; place-items: center; flex-shrink: 0;
        background: #f1f5f9; color: #475569;
      }
      .ai-insight-body { flex: 1; min-width: 0; }
      .ai-insight-top {
        display: flex; justify-content: space-between; align-items: baseline;
        gap: 4px;
      }
      .ai-insight-label { font-size: 10px; font-weight: 600; color: #475569; }
      .ai-insight-value { font-size: 13px; font-weight: 700; color: #0A1C60; letter-spacing: -0.01em; }
      .ai-insight-delta { font-size: 9px; font-weight: 600; margin-top: 1px; }
      .ai-insight-note { font-size: 9px; color: #64748b; margin-top: 3px; line-height: 1.4; }
      .ai-tone-good { border-left-color: #10b981; }
      .ai-tone-good .ai-insight-icon { background: #d1fae5; color: #065f46; }
      .ai-tone-good .ai-insight-delta { color: #065f46; }
      .ai-tone-warn { border-left-color: #f59e0b; }
      .ai-tone-warn .ai-insight-icon { background: #fef3c7; color: #92400e; }
      .ai-tone-warn .ai-insight-delta { color: #92400e; }
      .ai-tone-risk { border-left-color: #ef4444; }
      .ai-tone-risk .ai-insight-icon { background: #fee2e2; color: #991b1b; }
      .ai-tone-risk .ai-insight-delta { color: #991b1b; }

      /* Table output (used by 'Adoption & cost') */
      .ai-table-wrap {
        margin-top: 4px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        overflow: hidden;
      }
      .ai-table { width: 100%; border-collapse: collapse; font-size: 11px; }
      .ai-table-th {
        text-align: left;
        padding: 8px 10px;
        background: #0A1C60;
        color: #fff;
        font-size: 9.5px; font-weight: 700;
        letter-spacing: 0.06em; text-transform: uppercase;
        border-right: 1px solid rgba(255,255,255,0.08);
        white-space: nowrap;
      }
      .ai-table-th:last-child { border-right: 0; }
      .ai-table-row {
        border-top: 1px solid #e2e8f0;
        border-left: 3px solid transparent;
        opacity: 0;
        transform: translateY(9px);
        transition: opacity 0.42s ease, transform 0.42s cubic-bezier(0.2,0.8,0.2,1), background 0.15s ease;
      }
      [data-ai-phase="answer"] .ai-table-row,
      [data-ai-phase="done"]   .ai-table-row { opacity: 1; transform: none; }
      .ai-table-row.ai-tone-good { border-left-color: #10b981; background: #f7fdf9; }
      .ai-table-row.ai-tone-warn { border-left-color: #f59e0b; background: #fffaf2; }
      .ai-table-row.ai-tone-risk { border-left-color: #ef4444; background: #fff7f7; }
      .ai-table-td {
        padding: 9px 10px;
        vertical-align: top;
        color: #1e293b;
        line-height: 1.45;
        border-right: 1px solid #f1f5f9;
      }
      .ai-table-td:last-child { border-right: 0; }
      .ai-table-td:first-child {
        display: flex; align-items: center; gap: 7px;
        font-weight: 600; color: #0A1C60;
      }
      .ai-table-icon {
        display: inline-grid; place-items: center;
        width: 22px; height: 22px; border-radius: 6px;
        background: #f1f5f9; color: #475569;
        flex-shrink: 0;
      }
      .ai-table-row.ai-tone-good .ai-table-icon { background: #d1fae5; color: #065f46; }
      .ai-table-row.ai-tone-warn .ai-table-icon { background: #fef3c7; color: #92400e; }
      .ai-table-row.ai-tone-risk .ai-table-icon { background: #fee2e2; color: #991b1b; }
      .ai-table-cell { display: inline; }
      .ai-table-sub { color: #64748b; font-weight: 400; }
      .ai-align-left { text-align: left; }
      .ai-align-right { text-align: right; }
      .ai-table-td.ai-align-right { white-space: nowrap; }

      .ai-pill {
        display: inline-flex; align-items: center;
        padding: 2px 8px; border-radius: 999px;
        font-size: 9.5px; font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .ai-pill-good { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
      .ai-pill-warn { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
      .ai-pill-risk { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
      .ai-pill-info { background: #ddd6fe; color: #5b21b6; border: 1px solid #c4b5fd; }

      .ai-table-footnote {
        display: flex; align-items: center; gap: 5px;
        padding: 6px 10px;
        background: #fafbff;
        border-top: 1px dashed #c7d2fe;
        font-size: 10px; color: #475569;
        font-style: italic;
      }
      .ai-table-footnote svg { color: #8b5cf6; flex-shrink: 0; }

      .ai-actions { margin-top: 10px; }
      .ai-actions-label {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 9px; font-weight: 700;
        color: #6d28d9; text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 4px;
      }
      .ai-actions-list { display: flex; flex-wrap: wrap; gap: 5px; }
      .ai-action {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 10px; border-radius: 999px;
        background: #fff;
        border: 1px solid #ddd6fe;
        font-size: 10.5px; font-weight: 600;
        color: #0A1C60;

      .teams-msg-bubble { background: white; border: 1px solid #e2e8f0; border-radius: 0 8px 8px 8px; padding: 5px 8px; font-size: 10px; color: #334155; line-height: 1.3; max-width: 80%; }
      .teams-msg-bubble.self { background: #eff6ff; border-color: #bfdbfe; border-radius: 8px 0 8px 8px; margin-left: auto; }
      .teams-chat-input { padding: 6px 10px; border-top: 1px solid #e2e8f0; display: flex; align-items: center; gap: 6px; }
      .teams-chat-input-box { flex: 1; height: 24px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; padding: 0 8px; font-size: 9px; color: #94a3b8; display: flex; align-items: center; }

      /* Cinema Mode */
      .cinema-mode .device-frame { box-shadow: 0 12px 40px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.05); transform: scale(1.02); transition: transform 0.5s ease, box-shadow 0.5s ease; }
      @media (max-width: 768px) { .cinema-mode .device-frame { transform: none; } }
      .cinema-caption { font-size: 13px; font-weight: 600; text-align: center; padding: 10px 0 2px; color: #334155; min-height: 28px; transition: opacity 0.3s ease; }
      .cinema-caption.done-caption { color: #059669; }
      .cinema-caption .typing-cursor { display: inline-block; width: 2px; height: 14px; background: #0070F3; margin-left: 2px; vertical-align: middle; animation: blink 0.8s step-end infinite; }
      .cinema-caption.done-caption .typing-cursor { display: none; }
      @keyframes blink { 50% { opacity: 0; } }
      .cinema-progress { height: 3px; background: #e2e8f0; border-radius: 0 0 12px 12px; overflow: hidden; margin-top: -2px; }
      .cinema-progress-fill { height: 100%; background: linear-gradient(90deg, #0070F3, #10b981); transition: width 0.6s ease; border-radius: 0 0 12px 12px; }
      .phase-dots { display: flex; justify-content: center; gap: 10px; padding: 6px 0 2px; }
      .phase-dot { width: 8px; height: 8px; border-radius: 50%; background: #e2e8f0; transition: all 0.3s ease; }
      .phase-dot.active { background: #0070F3; box-shadow: 0 0 0 3px rgba(0,112,243,0.2); }
      .phase-dot.done { background: #10b981; }
      .platform-bar-mini { background: linear-gradient(135deg, #0A1C60 0%, #0070F3 100%); border-radius: 8px; padding: 8px 14px; color: white; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; position: relative; overflow: hidden; }
      .platform-bar-mini::before { content: ''; position: absolute; top: -50%; right: -10%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%); pointer-events: none; }
      .cinema-scenario-caption { font-size: 13px; font-weight: 600; color: #475569; text-align: center; padding: 2px 0 6px; }
      .cinema-working-badge { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 4px 12px; font-size: 10px; font-weight: 600; color: #059669; background: rgba(240,253,244,0.9); border: 1px solid #a7f3d0; border-radius: 9999px; backdrop-filter: blur(4px); margin: 4px auto 0; width: fit-content; }
      .flip-card { perspective: 1000px; cursor: pointer; height: 90px; transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
      .flip-card.flipped { height: 240px; }
      .flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
      .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
      .flip-card-front, .flip-card-back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius); border: 1px solid var(--border-subtle); overflow: hidden; }
      .flip-card-front { background: white; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; }
      .flip-card-back { background: #ffffff; color: #0A1C60; transform: rotateY(180deg); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid #0070F3; }
      .flip-card-stat { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #0070F3, #0A1C60); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; white-space: nowrap; }
      .flip-card-tap { font-size: 8px; color: #cbd5e1; opacity: 0; animation: fadeIn 1s ease 2s forwards; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      /* ── Modal narrative reveal animations: Change Velocity & Platform Multiplication ─ */
      /* Both animate the existing static composition so it unfolds over time, then settles on the final state. */

      /* === Continuous Change Velocity — chart draws itself === */
      .cv-anim-wrap .cv-frame   { opacity: 0; animation: cvFade 0.5s ease-out 0.1s forwards; }
      .cv-anim-wrap .cv-grid    { opacity: 0; animation: cvFade 0.5s ease-out 0.3s forwards; }
      .cv-anim-wrap .cv-xlabels { opacity: 0; animation: cvFade 0.4s ease-out 0.4s forwards; }
      .cv-anim-wrap .cv-ylabel  { opacity: 0; animation: cvFade 0.4s ease-out 0.4s forwards; }
      .cv-anim-wrap .cv-cap     { opacity: 0; animation: cvCapIn 0.6s ease-out 0.7s forwards; }
      @keyframes cvFade  { 0% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes cvCapIn { 0% { opacity: 0; transform: translateX(-20px); } 100% { opacity: 1; transform: translateX(0); } }
      /* Sweep clip rect grows from x=ml to ml+cw over ~3.5s — reveals stacked areas left to right */
      .cv-anim-wrap .cv-sweep-rect { animation: cvSweep 3.5s cubic-bezier(.4,.05,.4,1) 1.1s forwards; }
      @keyframes cvSweep { 0% { width: 0; } 100% { width: 645px; } }
      /* Milestone dots pop in at their year along the sweep timeline.
         Sweep starts at 1.1s and runs 3.5s; the three milestones land at year-indices 4,5,7 of 11 →
         t ≈ 4/11, 5/11, 7/11 of sweep duration. */
      .cv-anim-wrap .cv-mile { opacity: 0; transform: scale(0.4); transform-box: fill-box; transform-origin: center; }
      .cv-anim-wrap .cv-mile-0 { animation: cvMile 0.5s cubic-bezier(.34,1.56,.64,1) 2.4s forwards; }
      .cv-anim-wrap .cv-mile-1 { animation: cvMile 0.5s cubic-bezier(.34,1.56,.64,1) 2.7s forwards; }
      .cv-anim-wrap .cv-mile-2 { animation: cvMile 0.5s cubic-bezier(.34,1.56,.64,1) 3.4s forwards; }
      @keyframes cvMile { 0% { opacity: 0; transform: scale(0.4); } 100% { opacity: 1; transform: scale(1); } }
      .cv-anim-wrap .cv-detail { opacity: 0; transform: translateY(6px); animation: cvSlideUp 0.6s ease-out 4.8s forwards; }
      .cv-anim-wrap .cv-legend { opacity: 0; animation: cvFade 0.6s ease-out 5.1s forwards; }
      @keyframes cvSlideUp { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }

      /* === Platform Multiplication — silos drop in left-to-right, then disconnect Xs pop === */
      .pm-anim-wrap .pm-title   { opacity: 0; animation: cvFade 0.5s ease-out 0.1s forwards; }
      .pm-anim-wrap .pm-context { opacity: 0; transform: translateY(-4px); animation: cvSlideUp 0.5s ease-out 0.3s forwards; }
      .pm-anim-wrap .pm-silo    { opacity: 0; transform: translateY(12px) scale(0.96); }
      .pm-anim-wrap .pm-silo-0  { animation: pmSiloIn 0.5s cubic-bezier(.4,.05,.4,1) 0.8s forwards; }
      .pm-anim-wrap .pm-silo-1  { animation: pmSiloIn 0.5s cubic-bezier(.4,.05,.4,1) 1.0s forwards; }
      .pm-anim-wrap .pm-silo-2  { animation: pmSiloIn 0.5s cubic-bezier(.4,.05,.4,1) 1.2s forwards; }
      .pm-anim-wrap .pm-silo-3  { animation: pmSiloIn 0.5s cubic-bezier(.4,.05,.4,1) 1.4s forwards; }
      .pm-anim-wrap .pm-silo-4  { animation: pmSiloIn 0.5s cubic-bezier(.4,.05,.4,1) 1.6s forwards; }
      @keyframes pmSiloIn { 0% { opacity: 0; transform: translateY(12px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
      /* Disconnect Xs pop in AFTER all silos have landed — the disconnection is the punchline. */
      .pm-anim-wrap .pm-x       { opacity: 0; transform: translateY(-50%) scale(0.2); }
      .pm-anim-wrap .pm-x-0     { animation: pmXPop 0.45s cubic-bezier(.34,1.56,.64,1) 2.1s forwards; }
      .pm-anim-wrap .pm-x-1     { animation: pmXPop 0.45s cubic-bezier(.34,1.56,.64,1) 2.25s forwards; }
      .pm-anim-wrap .pm-x-2     { animation: pmXPop 0.45s cubic-bezier(.34,1.56,.64,1) 2.4s forwards; }
      .pm-anim-wrap .pm-x-3     { animation: pmXPop 0.45s cubic-bezier(.34,1.56,.64,1) 2.55s forwards; }
      @keyframes pmXPop { 0% { opacity: 0; transform: translateY(-50%) scale(0.2); } 70% { transform: translateY(-50%) scale(1.15); } 100% { opacity: 1; transform: translateY(-50%) scale(1); } }
      .pm-anim-wrap .pm-callout { opacity: 0; transform: translateY(4px); animation: cvSlideUp 0.5s ease-out 3.0s forwards; }
      .pm-anim-wrap .pm-impact  { opacity: 0; transform: translateX(8px); animation: pmImpactIn 0.6s ease-out 3.3s forwards; }
      @keyframes pmImpactIn { 0% { opacity: 0; transform: translateX(8px); } 100% { opacity: 1; transform: translateX(0); } }
      .pm-anim-wrap .pm-quote   { opacity: 0; animation: cvFade 0.5s ease-out 3.7s forwards; }

      /* ─── Impact sidebar: 5 rows, each with its own micro-animation ─── */
      .pm-imp-row { opacity: 0; transform: translateY(4px); }
      .pm-imp-row-0 { animation: impRowIn 0.4s ease-out 3.5s forwards; }
      .pm-imp-row-1 { animation: impRowIn 0.4s ease-out 4.1s forwards; }
      .pm-imp-row-2 { animation: impRowIn 0.4s ease-out 4.7s forwards; }
      .pm-imp-row-3 { animation: impRowIn 0.4s ease-out 5.3s forwards; }
      .pm-imp-row-4 { animation: impRowIn 0.4s ease-out 5.9s forwards; }
      @keyframes impRowIn { to { opacity: 1; transform: translateY(0); } }

      /* All impact visuals share a uniform 64×40 viz frame for consistent rhythm */
      .imp-viz { width: 64px; height: 40px; position: relative; display: flex; align-items: center; justify-content: center; }

      /* Row 1: 5× duplication — one app card clones into 5 stacked copies */
      .imp-dup { position: relative; width: 64px; height: 40px; }
      .imp-dup-card { position: absolute; width: 22px; height: 28px; border-radius: 3px; background: #fff; border: 1.5px solid #ef4444; left: 6px; top: 6px; box-shadow: 0 1px 2px rgba(239,68,68,0.15); }
      .imp-dup-card::before { content: ''; position: absolute; left: 3px; right: 3px; top: 4px; height: 3px; border-radius: 1.5px; background: #ef4444; }
      .imp-dup-card::after { content: ''; position: absolute; left: 3px; right: 3px; top: 11px; height: 2px; background: #fca5a5; border-radius: 1px; box-shadow: 0 4px 0 #fca5a5, 0 8px 0 #fca5a5; }
      .imp-dup-card-0 { z-index: 5; animation: impDupOrigin 4s ease-in-out 3.7s infinite; }
      .imp-dup-card-1 { z-index: 4; animation: impDupClone1 4s ease-in-out 3.7s infinite; }
      .imp-dup-card-2 { z-index: 3; animation: impDupClone2 4s ease-in-out 3.7s infinite; }
      .imp-dup-card-3 { z-index: 2; animation: impDupClone3 4s ease-in-out 3.7s infinite; }
      .imp-dup-card-4 { z-index: 1; animation: impDupClone4 4s ease-in-out 3.7s infinite; }
      @keyframes impDupOrigin { 0%, 100% { opacity: 1; transform: translate(0,0); } }
      @keyframes impDupClone1 { 0%, 10% { opacity: 0; transform: translate(0,0); } 20%, 90% { opacity: 1; transform: translate(7px, -3px); } 100% { opacity: 1; transform: translate(7px, -3px); } }
      @keyframes impDupClone2 { 0%, 15% { opacity: 0; transform: translate(0,0); } 25%, 90% { opacity: 1; transform: translate(14px, -1px); } 100% { opacity: 1; transform: translate(14px, -1px); } }
      @keyframes impDupClone3 { 0%, 20% { opacity: 0; transform: translate(0,0); } 30%, 90% { opacity: 1; transform: translate(21px, 2px); } 100% { opacity: 1; transform: translate(21px, 2px); } }
      @keyframes impDupClone4 { 0%, 25% { opacity: 0; transform: translate(0,0); } 35%, 90% { opacity: 1; transform: translate(28px, 5px); } 100% { opacity: 1; transform: translate(28px, 5px); } }

      /* Row 2: 5–10 day patch cycle — calendar grid filling day by day */
      .imp-cal { width: 56px; height: 36px; background: #fff; border: 1.5px solid #ef4444; border-radius: 4px; padding: 7px 4px 4px; position: relative; box-shadow: 0 1px 2px rgba(239,68,68,0.15); }
      .imp-cal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: #ef4444; border-radius: 2.5px 2.5px 0 0; }
      .imp-cal-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; gap: 2px; width: 100%; height: 100%; }
      .imp-cal-cell { background: #fee2e2; border-radius: 1px; }
      .imp-cal-cell-0 { animation: impCalFill 5s ease-in-out 3.7s infinite; }
      .imp-cal-cell-1 { animation: impCalFill 5s ease-in-out 3.85s infinite; }
      .imp-cal-cell-2 { animation: impCalFill 5s ease-in-out 4.0s infinite; }
      .imp-cal-cell-3 { animation: impCalFill 5s ease-in-out 4.15s infinite; }
      .imp-cal-cell-4 { animation: impCalFill 5s ease-in-out 4.3s infinite; }
      .imp-cal-cell-5 { animation: impCalFill 5s ease-in-out 4.45s infinite; }
      .imp-cal-cell-6 { animation: impCalFill 5s ease-in-out 4.6s infinite; }
      .imp-cal-cell-7 { animation: impCalFill 5s ease-in-out 4.75s infinite; }
      .imp-cal-cell-8 { animation: impCalFill 5s ease-in-out 4.9s infinite; }
      .imp-cal-cell-9 { animation: impCalFill 5s ease-in-out 5.05s infinite; }
      @keyframes impCalFill {
        0%, 5% { background: #fee2e2; }
        15%, 90% { background: #ef4444; }
        100% { background: #ef4444; }
      }

      /* Row 3: 30–65% reactive work — donut filling to 65% */
      .imp-donut { width: 36px; height: 36px; }
      .imp-donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .imp-donut .ring-bg { fill: none; stroke: #fee2e2; stroke-width: 6; }
      .imp-donut .ring-fg { fill: none; stroke: #ef4444; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 75.4; stroke-dashoffset: 75.4; animation: impDonutFill 4s ease-in-out 3.9s infinite; }
      .imp-donut-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #ef4444; letter-spacing: -0.02em; }
      @keyframes impDonutFill {
        0% { stroke-dashoffset: 75.4; }
        40%, 90% { stroke-dashoffset: 26.4; }
        100% { stroke-dashoffset: 26.4; }
      }

      /* Row 4: Manual compliance evidence — page with check being drawn by a pen */
      .imp-page { width: 38px; height: 38px; background: #fff; border: 1.5px solid #ef4444; border-radius: 3px; position: relative; padding: 5px; box-shadow: 0 1px 2px rgba(239,68,68,0.15); }
      .imp-page::before { content: ''; position: absolute; top: 6px; left: 5px; right: 14px; height: 2px; background: #fecaca; border-radius: 1px; box-shadow: 0 5px 0 #fecaca; }
      .imp-page-check { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); width: 22px; height: 18px; }
      .imp-page-check path { fill: none; stroke: #ef4444; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 32; stroke-dashoffset: 32; animation: impCheckDraw 4s ease-in-out 4.1s infinite; }
      @keyframes impCheckDraw {
        0%, 5% { stroke-dashoffset: 32; }
        25%, 90% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }

      /* Row 5: No single pane of glass — fragmented monitor with prohibition slash */
      .imp-glass { position: relative; width: 56px; height: 38px; }
      .imp-glass-monitor { width: 100%; height: 30px; background: #fff; border: 1.5px solid #ef4444; border-radius: 3px; padding: 3px; box-shadow: 0 1px 2px rgba(239,68,68,0.15); }
      .imp-glass-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 2px; width: 100%; height: 100%; }
      .imp-glass-cell { background: #fee2e2; border-radius: 1.5px; }
      .imp-glass-stand { width: 14px; height: 4px; background: #ef4444; border-radius: 0 0 2px 2px; margin: 0 auto; }
      .imp-glass-stand::after { content: ''; display: block; width: 22px; height: 2px; background: #ef4444; border-radius: 1px; margin: 2px auto 0; }
      .imp-glass-slash { position: absolute; top: -2px; left: -2px; width: 60px; height: 42px; pointer-events: none; }
      .imp-glass-slash circle { fill: none; stroke: #ef4444; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 110; stroke-dashoffset: 110; animation: impSlashCirc 4s ease-in-out 4.3s infinite; }
      .imp-glass-slash line { stroke: #ef4444; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 50; stroke-dashoffset: 50; animation: impSlashLine 4s ease-in-out 4.65s infinite; }
      @keyframes impSlashCirc { 0%, 5% { stroke-dashoffset: 110; } 30%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
      @keyframes impSlashLine { 0%, 15% { stroke-dashoffset: 50; } 35%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .cv-anim-wrap .cv-frame, .cv-anim-wrap .cv-grid, .cv-anim-wrap .cv-xlabels, .cv-anim-wrap .cv-ylabel,
        .cv-anim-wrap .cv-cap, .cv-anim-wrap .cv-mile, .cv-anim-wrap .cv-detail, .cv-anim-wrap .cv-legend,
        .pm-anim-wrap .pm-title, .pm-anim-wrap .pm-context, .pm-anim-wrap .pm-silo, .pm-anim-wrap .pm-x,
        .pm-anim-wrap .pm-callout, .pm-anim-wrap .pm-impact, .pm-anim-wrap .pm-quote,
        .pm-anim-wrap .pm-imp-row,
        .pm-anim-wrap .imp-dup-card, .pm-anim-wrap .imp-cal-cell, .pm-anim-wrap .imp-bar-fill,
        .pm-anim-wrap .imp-page-check path, .pm-anim-wrap .imp-glass-slash circle, .pm-anim-wrap .imp-glass-slash line {
          animation-duration: 0.001s !important; animation-delay: 0s !important;
          opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important;
        }
        .cv-anim-wrap .cv-sweep-rect { animation-duration: 0.001s !important; animation-delay: 0s !important; width: 645px !important; }
      }

      .logo-ticker-wrap { overflow: hidden; position: relative; padding: 8px 0; }
      .logo-ticker-wrap::before, .logo-ticker-wrap::after { content: ''; position: absolute; top: 0; bottom: 0; width: 48px; z-index: 1; pointer-events: none; }
      .logo-ticker-wrap::before { left: 0; background: linear-gradient(90deg, white 0%, transparent 100%); }
      .logo-ticker-wrap::after { right: 0; background: linear-gradient(270deg, white 0%, transparent 100%); }
      .logo-ticker { display: flex; align-items: center; gap: 40px; animation: tickerScroll 90s linear infinite; width: max-content; }
      .logo-ticker:hover { animation-play-state: paused; }
      @keyframes tickerScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
      .logo-name { font-size: 13px; font-weight: 700; color: #334155; white-space: nowrap; flex-shrink: 0; letter-spacing: -0.02em; opacity: 0.7; }
      .logo-name:hover { opacity: 1; }
      .logo-divider { width: 1px; height: 16px; background: #e2e8f0; flex-shrink: 0; }

      /* ══════════════════════════════════════════════════════════════
         RECAST SOFTWARE BRAND OVERRIDE — applied on top of legacy styles
         Primary blue #0000CC, Accent cyan #00BFFF, flat surfaces, Inter
         ══════════════════════════════════════════════════════════════ */
      :root {
        /* Recast Application Workspace tokens — true brand palette */
        --r-blue: #0000CC;           /* Primary Brand Blue — hero, top bar, footer */
        --r-blue-hover: #0000A8;
        --r-blue-bright: #00BFFF;    /* Accent Cyan — CTAs, highlights, "+" energy */
        --r-cyan: #00BFFF;
        --r-cyan-hover: #33CCFF;
        --r-orange: #00BFFF;
        --r-decorator: rgba(0,191,255,0.35);  /* cyan "+" marks on hero — subtle, on-brand */
        --r-decorator-2: rgba(0,191,255,0.25);
        --r-ink: #1A1A2E;
        --r-ink-2: #4A4A5A;
        --r-muted-blue: #AABBEE;
        --r-surface: #FFFFFF;
        --r-surface-2: #F0F0F6;
        --r-surface-3: #FAFAFE;
        --r-quote-bg: #F6F8FF;
        --r-divider: #DDDDEE;
        --r-red: #CC2222;
        --r-green: #0F7A3F;
        --r-amber: #CC8800;

        --shadow-card: 0 1px 2px rgba(26,26,46,0.06);
        --shadow-hover: 0 2px 8px rgba(26,26,46,0.10);
        --shadow-elevated: 0 8px 24px rgba(26,26,46,0.12);
        --re-green: var(--r-green);
        --bg-main: #FAFAFE;
      }

      html, body {
        background: var(--bg-main) !important;
        background-attachment: initial !important;
        color: var(--r-ink) !important;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif !important;
        -webkit-font-smoothing: antialiased;
      }
      body { letter-spacing: -0.005em; }

      /* ───── Color remap: #0070F3 (brand accent) → Recast primary blue
         (used for CTAs, borders, brand text). Uses attribute selectors
         to target remaining inline styles without hand-editing each.  */
      [style*="#0070F3"] { /* will be overridden per-property below */ }
      [style*="color:#0070F3"], [style*="color: #0070F3"] { color: var(--r-blue) !important; }
      [style*="background:#0070F3"], [style*="background: #0070F3"],
      [style*="background-color:#0070F3"], [style*="background-color: #0070F3"] { background-color: var(--r-cyan) !important; }
      [style*="border-color:#0070F3"], [style*="border-color: #0070F3"] { border-color: var(--r-blue) !important; }

      /* #0A1C60 (navy headline) → Recast primary blue */
      [style*="color:#0A1C60"], [style*="color: #0A1C60"] { color: var(--r-blue) !important; }
      [style*="background:#0A1C60"], [style*="background: #0A1C60"],
      [style*="background-color:#0A1C60"] { background-color: var(--r-blue) !important; }
      [style*="border-color:#0A1C60"] { border-color: var(--r-blue) !important; }

      /* Tailwind arbitrary values used throughout */
      .text-\[\#0070F3\] { color: var(--r-blue) !important; }
